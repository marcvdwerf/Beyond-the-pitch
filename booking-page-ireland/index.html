<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Experience - Beyond the Pitch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #059669; --secondary: #064e3b; --text: #1f2937; --bg-gradient: linear-gradient(135deg, #059669 0%, #064e3b 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text); position: relative; }
        .booking-container { max-width: 850px; width: 100%; background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden; }
        .header { background: #1a202c; color: white; padding: 50px 30px; text-align: center; background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1594223522959-1e38944f8f4a?auto=format&fit=crop&q=80'); background-size: cover; background-position: center; }
        .form-section { padding: 40px; }
        .section-title { font-size: 0.9rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; border-bottom: 2px solid #f7fafc; padding-bottom: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        input, select, textarea { padding: 14px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 1rem; background: #f8fafc; outline: none; transition: 0.2s; width: 100%; }
        input:focus { border-color: var(--primary); background: white; }
        .experience-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .exp-card { border: 2px solid #edf2f7; border-radius: 16px; padding: 18px; cursor: pointer; transition: 0.3s; position: relative; }
        .exp-card.selected { border-color: var(--primary); background: rgba(5,150,105,0.05); }
        .exp-card input { position: absolute; opacity: 0; }
        .price-tag { display: block; color: var(--primary); font-weight: 700; margin-bottom: 5px; }
        .fixture-section { background: #f8fafc; border-radius: 16px; margin-bottom: 25px; border: 1px solid #e2e8f0; min-height: 50px; }
        .fixture-section.disabled { opacity: 0.4; pointer-events: none; }
        .fixture-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px; cursor: pointer; margin: 10px; background: white; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .fixture-card:hover { border-color: #a7d9c5; }
        .fixture-card.selected { border-color: var(--primary); background: #f0fdf8; }
        .btn-stripe { background: var(--primary); color: white; border: none; padding: 20px; border-radius: 14px; font-size: 1.05rem; font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-stripe:hover:not(:disabled) { background: var(--secondary); transform: translateY(-1px); }
        .btn-stripe:disabled { opacity: 0.5; cursor: not-allowed; }
        .promo-msg { font-size: 0.8rem; color: #059669; font-weight: 600; margin-top: 5px; display: none; }
        @media (max-width: 600px) { .experience-grid, .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="booking-container">
    <div class="header">
        <h1>Beyond the Pitch</h1>
        <p>Official Experience Booking Portal</p>
    </div>

    <div class="form-section" id="bookingForm">
        <div class="section-title">1. Personal Information</div>
        <div class="form-grid">
            <input type="text" id="name" placeholder="Full Name *" required>
            <input type="email" id="email" placeholder="Email Address *" required>
        </div>

        <div class="section-title">2. Choose Your Experience</div>
        <div class="experience-grid">
            <label class="exp-card" id="card-kilkenny">
                <input type="radio" name="experience" value="Kilkenny Experience" onclick="filterByLocation('Kilkenny')">
                <span class="price-tag">from €120 p.p.</span>
                <strong>Kilkenny Experience</strong>
                <small style="display:block; margin-top:5px; color:#666;">Training + match at Nowlan Park.</small>
            </label>
            <label class="exp-card" id="card-dublin">
                <input type="radio" name="experience" value="Dublin Experience" onclick="filterByLocation('Dublin')">
                <span class="price-tag">from €140 p.p.</span>
                <strong>Dublin Experience</strong>
                <small style="display:block; margin-top:5px; color:#666;">City tour + match at Croke/Parnell Park.</small>
            </label>
        </div>

        <div class="section-title">3. Select Match Fixture</div>
        <div class="fixture-section disabled" id="fixtureSection">
            <div id="fixtureList"></div>
        </div>

        <div class="section-title">4. Trip Details</div>
        <div class="form-grid">
            <div>
                <label style="font-size:0.75rem; color:#666;">Number of Guests (min. 4) *</label>
                <input type="number" id="guests" value="4" min="4" oninput="calculateTotal()">
            </div>
            <div>
                <label style="font-size:0.75rem; color:#666;">Promo Code</label>
                <input type="text" id="promoCode" placeholder="Enter code" oninput="calculateTotal()">
                <div id="promoMsg" class="promo-msg">✓ Early Bird discount applied (€10 off deposit p.p.)</div>
            </div>
        </div>

        <button type="button" class="btn-stripe" id="submitBtn" disabled onclick="handleStripeCheckout()">
            Select an experience and match
        </button>
    </div>
</div>

<script>
    let currentDeposit = 50;
    const API_ENDPOINT = '/api/create-checkout';

    const MATCHES = [
        { date: "2026-04-25", teams: "Kilkenny v Wexford", venue: "Nowlan Park", location: "Kilkenny", sport: "Hurling" },
        { date: "2026-05-16", teams: "Kilkenny v Kildare", venue: "Nowlan Park", location: "Kilkenny", sport: "Hurling" },
        { date: "2026-04-26", teams: "Dublin v Kildare", venue: "Parnell Park", location: "Dublin", sport: "Football" },
        { date: "2026-05-24", teams: "Dublin v Kilkenny", venue: "Croke Park", location: "Dublin", sport: "Hurling" },
        { date: "2026-06-06", teams: "Leinster Final", venue: "Croke Park", location: "Dublin", sport: "Championship" }
    ];

    let selectedMatch = null;
    let selectedExperience = "";

    function filterByLocation(loc) {
        selectedExperience = loc + " Experience";
        document.querySelectorAll('.exp-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('card-' + loc.toLowerCase()).classList.add('selected');
        document.getElementById('fixtureSection').classList.remove('disabled');
        
        const list = document.getElementById('fixtureList');
        list.innerHTML = '';

        MATCHES.filter(m => m.location === loc).forEach(m => {
            const card = document.createElement('div');
            card.className = 'fixture-card';
            card.innerHTML = `<div><strong>${m.teams}</strong><br><small>${m.date} · ${m.venue}</small></div>`;
            card.onclick = () => {
                document.querySelectorAll('.fixture-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMatch = m;
                calculateTotal();
            };
            list.appendChild(card);
        });
        calculateTotal();
    }

    function calculateTotal() {
        const guests = document.getElementById('guests').value;
        const promo = document.getElementById('promoCode').value.toUpperCase().trim();
        const msg = document.getElementById('promoMsg');
        
        // Korting logica
        if (promo === "EARLYBIRD") {
            currentDeposit = 40;
            msg.style.display = "block";
        } else {
            currentDeposit = 50;
            msg.style.display = "none";
        }

        const total = guests * currentDeposit;
        const btn = document.getElementById('submitBtn');

        if (selectedMatch && guests >= 4) {
            btn.disabled = false;
            btn.innerText = `Pay €${total} Deposit to Confirm`;
        } else {
            btn.disabled = true;
            btn.innerText = guests < 4 ? "Minimum 4 guests required" : "Select a match fixture";
        }
    }

    async function handleStripeCheckout() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const guests = document.getElementById('guests').value;

        if (!name || !email) { alert("Please fill in your details."); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Connecting to Stripe...";

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    experience: selectedExperience,
                    fixture: selectedMatch.teams + " (" + selectedMatch.date + ")",
                    guests: guests,
                    amount: guests * currentDeposit * 100, // Centen
                    promo: document.getElementById('promoCode').value
                })
            });
            const session = await response.json();
            if (session.url) window.location.href = session.url;
        } catch (err) {
            alert("Error: " + err.message);
            btn.disabled = false;
            calculateTotal();
        }
    }
</script>

</body>
</html>

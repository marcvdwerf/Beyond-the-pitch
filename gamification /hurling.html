<!DOCTYPE html>
<html lang="nl">
<head>
<style>
  :root {
    --gold: #FFD700;
    --rarity-glow: rgba(255, 215, 0, 0.6);
  }

  .card-container {
    width: 280px;
    height: 400px;
    perspective: 1000px;
    margin: 50px auto;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    cursor: pointer;
  }

  /* De class die we met JavaScript toevoegen */
  .card-inner.is-flipped {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 20px;
    border: 5px solid var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  /* Voorkant: Het gesloten pakje */
  .card-front {
    background: linear-gradient(45deg, #1a1a1a, #4a4a4a);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
  }

  /* Achterkant: De Hurling Speler */
  .card-back {
    background: white;
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    padding: 15px;
    box-sizing: border-box;
    /* Extra glans effect voor de speler */
    box-shadow: 0 0 20px var(--rarity-glow);
  }

  .player-image {
    width: 100%;
    height: 200px;
    background: #eee; /* Hier komt je afbeelding */
    border-radius: 10px;
    margin-top: 10px;
  }

  .stats {
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-weight: bold;
  }

  /* Simpele schud-animatie voor het pakje */
  .card-inner:not(.is-flipped):hover {
    animation: shake 0.5s infinite;
  }

  @keyframes shake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(2deg); }
    75% { transform: rotate(-2deg); }
    100% { transform: rotate(0deg); }
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="card-inner" id="hurlingCard">
    
    <div class="card-front">
      <div style="font-size: 60px;">🏆</div>
      <h2>TIK OM TE OPENEN</h2>
      <p>Hurling Stars 2026</p>
    </div>

    <div class="card-back">
      <div style="font-size: 24px; font-weight: bold; text-align: left;">92</div>
      <div class="player-image">
         <img src="https://via.placeholder.com/250x200?text=SPELER+FOTO" alt="Player" style="width:100%; height:100%; border-radius:10px; object-fit:cover;">
      </div>
      <h2 style="margin: 10px 0 0 0;">Joe Canning</h2>
      <p style="margin: 0; color: #777;">Galway | Forward</p>
      
      <div class="stats">
        <div>ACC: 95</div>
        <div>STR: 88</div>
        <div>SPD: 82</div>
        <div>SKL: 97</div>
      </div>
    </div>

  </div>
</div>

<script>
  const card = document.getElementById('hurlingCard');
  
  card.addEventListener('click', function() {
    // Toggle de class 'is-flipped'
    card.classList.toggle('is-flipped');
  });
</script>

</body>
</html>

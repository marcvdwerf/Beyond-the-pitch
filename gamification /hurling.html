<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
    
    #pack-opening-area { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    /* De Kaart Styling */
    .card-to-download {
      width: 320px; height: 460px;
      background: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #b8860b 100%); /* Goud voor Legends */
      border-radius: 20px; border: 6px solid #fff; position: relative;
      color: #111; overflow: hidden; display: none;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.6);
    }

    .player-img { width: 100%; height: 250px; object-fit: cover; background: #eee; }
    .card-info { padding: 15px; background: rgba(255,255,255,0.9); height: 100%; }
    .rating { position: absolute; top: 15px; left: 15px; font-size: 45px; font-weight: 900; color: #111; text-shadow: 1px 1px 0 #fff; }

    /* Knoppen */
    .btn {
      margin-top: 20px; padding: 12px 25px; font-size: 18px; font-weight: bold;
      cursor: pointer; background: #d4af37; border: none; border-radius: 8px; color: black;
    }
    .btn-download { background: #27ae60; color: white; display: none; margin-left: 10px; }

    /* Pack Animatie */
    .pack { width: 180px; height: 260px; background: #d4af37; border: 4px solid #fff; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .pack:hover { transform: scale(1.1) rotate(2deg); }
  </style>
</head>
<body>

<div id="pack-opening-area">
  <div id="pack" class="pack" onclick="revealLegend()">
    <div>HURLING<br>LEGENDS<br>PACK</div>
  </div>

  <div id="legendCard" class="card-to-download">
    <div class="rating" id="cardRating">99</div>
    <img src="" id="cardImg" class="player-img">
    <div class="card-info">
      <h2 id="cardName" style="margin:0;">Naam</h2>
      <p id="cardTeam" style="margin:5px 0; color: #555;">Team</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-weight: bold; margin-top: 15px;">
        <div id="stat1">PAC: 90</div><div id="stat2">SHT: 90</div>
        <div id="stat3">PHY: 90</div><div id="stat4">SKL: 90</div>
      </div>
    </div>
  </div>

  <div id="actions">
    <button class="btn" onclick="location.reload()">VOLGENDE PACK</button>
    <button class="btn btn-download" id="downloadBtn" onclick="downloadCard()">DOWNLOAD KAART</button>
  </div>
</div>

<script>
  // DE TOP 30 LEGENDS
  const legends = [
    { name: "Henry Shefflin", team: "Kilkenny", rating: 98, stats: [92, 99, 94, 97], img: "https://via.placeholder.com/320x250?text=Henry+Shefflin" },
    { name: "Christy Ring", team: "Cork", rating: 99, stats: [90, 99, 98, 99], img: "https://via.placeholder.com/320x250?text=Christy+Ring" },
    { name: "Joe Canning", team: "Galway", rating: 96, stats: [88, 97, 92, 98], img: "https://via.placeholder.com/320x250?text=Joe+Canning" },
    { name: "Eddie Keher", team: "Kilkenny", rating: 97, stats: [85, 99, 88, 96], img: "https://via.placeholder.com/320x250?text=Eddie+Keher" },
    { name: "DJ Carey", team: "Kilkenny", rating: 96, stats: [95, 94, 85, 98], img: "https://via.placeholder.com/320x250?text=DJ+Carey" }
    // Voeg hier zelf de overige 25 legends toe op dezelfde manier...
  ];

  function revealLegend() {
    // Pak een willekeurige speler
    const randomLegend = legends[Math.floor(Math.random() * legends.length)];
    
    // Vul de kaart met data
    document.getElementById('cardName').innerText = randomLegend.name;
    document.getElementById('cardTeam').innerText = randomLegend.team;
    document.getElementById('cardRating').innerText = randomLegend.rating;
    document.getElementById('cardImg').src = randomLegend.img;
    document.getElementById('stat1').innerText = "PAC: " + randomLegend.stats[0];
    document.getElementById('stat2').innerText = "SHT: " + randomLegend.stats[1];
    document.getElementById('stat3').innerText = "PHY: " + randomLegend.stats[2];
    document.getElementById('stat4').innerText = "SKL: " + randomLegend.stats[3];

    // Toon kaart en verberg pack
    document.getElementById('pack').style.display = 'none';
    document.getElementById('legendCard').style.display = 'block';
    document.getElementById('downloadBtn').style.display = 'inline-block';
  }

  function downloadCard() {
    const card = document.getElementById('legendCard');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = 'my-hurling-legend.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>

</body>
</html>

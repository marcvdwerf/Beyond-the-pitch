<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurling Legends | Premium Unboxing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #d4af37;
      --gold-bright: #f9f295;
      --dark: #050505;
    }

    body { 
      background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); 
      color: white; 
      font-family: 'Rajdhani', sans-serif; 
      margin: 0; 
      overflow: hidden; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }

    /* Home Knop */
    .home-btn {
      position: absolute; top: 20px; left: 20px;
      padding: 10px 25px; background: rgba(255, 255, 255, 0.05);
      color: white; text-decoration: none; border-radius: 5px;
      border: 1px solid var(--gold);
      font-weight: bold; transition: 0.3s; z-index: 1000;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .home-btn:hover { background: var(--gold); color: black; }

    /* Header & Credits */
    .header-info { position: absolute; top: 80px; text-align: center; width: 100%; }
    .credits-display {
      font-family: 'Orbitron'; color: var(--gold); font-size: 16px;
      border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px;
      background: rgba(0,0,0,0.6); display: inline-block;
    }

    /* Premium Pack Styling */
    #pack-area { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    
    .pack-glow {
      position: absolute; width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, transparent 70%);
      z-index: -1; animation: pulseGlow 3s infinite alternate;
    }

    .pack-wrapper {
      position: relative; width: 240px; height: 350px;
      transition: 0.4s; animation: float 4s ease-in-out infinite;
      display: flex; flex-direction: column; align-items: center;
    }

    .pack-visual {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 12px; border: 2px solid var(--gold);
      box-shadow: 0 15px 50px rgba(0,0,0,0.9);
    }

    .pack-label {
      position: absolute; bottom: 20px; background: rgba(0,0,0,0.85);
      width: 85%; padding: 12px; text-align: center;
      border-radius: 8px; border: 1px solid var(--gold);
      backdrop-filter: blur(8px);
    }

    /* Card 3D Flip */
    #card-container { perspective: 1000px; display: none; width: 340px; height: 500px; }
    .card-inner { position: relative; width: 100%; height: 100%; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .is-flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 6px solid #fff; overflow: hidden; }
    
    .card-back { background: #111; display: flex; justify-content: center; align-items: center; border: 6px solid var(--gold); }
    .card-back img { width: 180px; filter: drop-shadow(0 0 10px var(--gold)); }
    
    .card-front { background: linear-gradient(135deg, #b8860b 0%, #fbdf93 50%, #b8860b 100%); color: #111; transform: rotateY(180deg); }
    .player-img { width: 100%; height: 290px; object-fit: contain; margin-top: 15px; position: relative; z-index: 2; }
    .card-content { padding: 15px 25px; text-align: center; background: rgba(255, 255, 255, 0.95); position: relative; z-index: 3; height: 100%; }
    .rating-big { position: absolute; top: 40px; left: 25px; font-size: 60px; font-family: 'Orbitron'; font-weight: 900; z-index: 10; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; font-weight: 700; border-top: 2px solid rgba(0,0,0,0.1); padding-top: 10px; font-size: 18px; }

    /* UI & Animations */
    .controls { display: none; margin-top: 20px; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 12px 20px; border: none; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%); }
    .btn-next { background: var(--gold); color: black; }
    .btn-save { background: #fff; color: black; }
    .btn-share { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }

    #out-of-credits { display: none; text-align: center; background: rgba(0,0,0,0.85); padding: 40px; border-radius: 15px; border: 2px solid var(--gold); z-index: 2000; }
    
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes pulseGlow { from { transform: scale(0.8); opacity: 0.4; } to { transform: scale(1.2); opacity: 0.7; } }
    #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 3000; }
    .flash-trigger { animation: flashEffect 0.8s ease-out; }
    @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    .shake-active { animation: shake 0.15s infinite !important; }
    @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-3px, -1px); } }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <a href="/gaelic-games.html" class="home-btn">🏠 Home</a>

  <div class="header-info">
    <div class="credits-display">CREDITS: <span id="credit-count">3</span> / 3</div>
  </div>

  <div id="out-of-credits">
    <h2 style="font-family: 'Orbitron'; color: var(--gold);">LIMIT REACHED</h2>
    <p>Premium credits exhausted for this session.</p>
    <button class="btn btn-next" onclick="location.reload()">RELOAD PACKS</button>
  </div>

  <div id="pack-area" onclick="initiateOpening()">
    <div class="pack-glow"></div>
    <div id="main-pack" class="pack-wrapper">
      <img src="https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/afbeelding%20pakket.png" class="pack-visual">
      <div class="pack-label">
        <h2 style="font-family: 'Orbitron'; color: var(--gold); margin: 0; font-size: 18px;">LEGEND PACK</h2>
        <p id="status-text" style="opacity:0.8; margin: 5px 0 0 0; font-size: 12px; letter-spacing: 2px;">TAP TO UNLOCK</p>
      </div>
    </div>
  </div>

  <div id="card-container">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-back">
         <img src="https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/images/beyond%20the%20pitch%20logo.jpg" alt="Logo">
      </div>
      <div class="card-face card-front" id="legendCard">
        <div class="rating-big" id="cardRating">99</div>
        <img src="" id="cardImg" class="player-img">
        <div class="card-content">
          <h2 id="cardName" style="margin:0; font-size: 24px; font-family: 'Orbitron';">NAME</h2>
          <p id="cardTeam" style="margin:0; font-weight: bold; color: #444; letter-spacing: 2px;">COUNTY</p>
          <div class="stats-grid">
            <div id="s1">PAC: 90</div><div id="s2">SHT: 90</div>
            <div id="s3">PHY: 90</div><div id="s4">SKL: 90</div>
          </div>
          <p style="font-size: 10px; font-weight: bold; margin-top: 15px; opacity: 0.6;">TRAVELBEYONDTHEPITCH.COM</p>
        </div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn btn-next" onclick="tryAgain()">NEXT PACK</button>
    <button class="btn btn-save" onclick="downloadImage()">SAVE PNG</button>
    <button class="btn btn-share" onclick="shareToStory()">SHARE TO STORY</button>
  </div>

<script>
let credits = 3;
const legends = [
  { name: "Henry Shefflin", team: "Kilkenny", rat: 98, stats: [88, 99, 94, 97], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/henry%20shefflin.jpg" },
  { name: "Christy Ring", team: "Cork", rat: 99, stats: [91, 99, 98, 99], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/christy%20ring.jpg" },
  { name: "Joe Canning", team: "Galway", rat: 96, stats: [82, 98, 92, 98], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Joe%20canning.jpg" },
  { name: "Eddie Keher", team: "Kilkenny", rat: 97, stats: [84, 99, 87, 95], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/eddie%20Keher.jpg" },
  { name: "Nicky Rackard", team: "Wexford", rat: 96, stats: [80, 99, 97, 90], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Nicky%20Rackard.jpg" },
  { name: "Jimmy Doyle", team: "Tipperary", rat: 95, stats: [86, 96, 82, 97], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Jimmy%20Doyle.jpg" },
  { name: "Mick Mackey", team: "Limerick", rat: 96, stats: [88, 94, 98, 92], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Mick%20Mackey.jpg" },
  { name: "Brian Whelahan", team: "Offaly", rat: 95, stats: [85, 88, 90, 96], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Brian%20whelahan.jpg" },
  { name: "Ken McGrath", team: "Waterford", rat: 94, stats: [84, 87, 95, 92], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Ken%20Mcgrath.jpg" },
  { name: "T.J. Reid", team: "Kilkenny", rat: 95, stats: [80, 97, 89, 96], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/T.J.%20Reid.jpg" },
  { name: "Patrick Horgan", team: "Cork", rat: 93, stats: [83, 96, 82, 95], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Patrick%20Horgan.jpg" },
  { name: "John Doyle", team: "Tipperary", rat: 95, stats: [82, 80, 99, 88], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/John%20Doyle.jpg" },
  { name: "Brian Corcoran", team: "Cork", rat: 94, stats: [82, 85, 96, 93], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Brian%20corcoran.jpg" },
  { name: "Tony Keady", team: "Galway", rat: 93, stats: [84, 86, 95, 90], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Tony%20Keady.jpg" },
  { name: "Pádraic Maher", team: "Tipperary", rat: 93, stats: [82, 82, 97, 88], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Padraic%20maher.jpg" },
  { name: "JJ Delaney", team: "Kilkenny", rat: 96, stats: [86, 75, 94, 98], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/JJ%20Delaney.jpg" },
  { name: "Cian Lynch", team: "Limerick", rat: 94, stats: [87, 85, 88, 99], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Cian%20Lync.jpg" },
  { name: "Eoin Kelly", team: "Tipperary", rat: 94, stats: [85, 97, 84, 94], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/eoin%20Kelly.jpg" },
  { name: "Tommy Walsh", team: "Kilkenny", rat: 95, stats: [88, 84, 92, 95], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Tommy%20Walsh.jpg" },
  { name: "Babs Keating", team: "Tipperary", rat: 92, stats: [82, 91, 88, 93], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Babs%20Keating.jpg" },
  { name: "Ger Loughnane", team: "Clare", rat: 91, stats: [84, 82, 93, 89], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Ger%20Loughnane.jpg" },
  { name: "Dan Shanahan", team: "Waterford", rat: 91, stats: [86, 93, 94, 85], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Dan%20Shanahan.jpg" },
  { name: "Cyril Farrell", team: "Galway", rat: 90, stats: [80, 85, 88, 92], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Cyril%20farrell.jpg" },
  { name: "Jack Lynch", team: "Cork", rat: 94, stats: [85, 89, 90, 94], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Jack%20Lynch.jpg" },
  { name: "Frank Cummins", team: "Kilkenny", rat: 93, stats: [82, 84, 96, 89], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Frank%20cummins.jpg" },
  { name: "Tony Doran", team: "Wexford", rat: 91, stats: [78, 92, 95, 84], img: "https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/gamification/Tony%20Doran.jpg" }
];

function initiateOpening() {
  if (credits <= 0) return;
  credits--;
  document.getElementById('credit-count').innerText = credits;
  
  const pack = document.getElementById('main-pack');
  const flash = document.getElementById('flash-overlay');
  document.getElementById('pack-area').onclick = null;
  document.getElementById('status-text').innerText = "UNLOCKING...";
  pack.classList.add('shake-active');

  setTimeout(() => {
    flash.classList.add('flash-trigger');
    setTimeout(revealLegend, 400);
  }, 4000); 
}

function revealLegend() {
  const random = legends[Math.floor(Math.random() * legends.length)];
  document.getElementById('cardName').innerText = random.name;
  document.getElementById('cardTeam').innerText = random.team.toUpperCase();
  document.getElementById('cardRating').innerText = random.rat;
  document.getElementById('cardImg').src = random.img;
  document.getElementById('s1').innerText = "PAC: " + random.stats[0];
  document.getElementById('s2').innerText = "SHT: " + random.stats[1];
  document.getElementById('s3').innerText = "PHY: " + random.stats[2];
  document.getElementById('s4').innerText = "SKL: " + random.stats[3];

  document.getElementById('pack-area').style.display = 'none';
  document.getElementById('card-container').style.display = 'block';

  setTimeout(() => {
    document.getElementById('cardInner').classList.add('is-flipped');
    setTimeout(() => { document.getElementById('controls').style.display = 'flex'; }, 1200);
  }, 100);
}

function tryAgain() {
  if (credits > 0) {
    document.getElementById('cardInner').classList.remove('is-flipped');
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('pack-area').style.display = 'flex';
    document.getElementById('pack-area').onclick = initiateOpening;
    document.getElementById('main-pack').classList.remove('shake-active');
    document.getElementById('status-text').innerText = "TAP TO UNLOCK";
  } else {
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('out-of-credits').style.display = 'block';
  }
}

function downloadImage() {
  const card = document.getElementById('legendCard');
  html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = `Legend_${document.getElementById('cardName').innerText}.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
}

async function shareToStory() {
  const card = document.getElementById('legendCard');
  const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true });
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'LegendCard.png', { type: 'image/png' });
    if (navigator.share) {
      try {
        await navigator.share({
          files: [file],
          title: 'My Hurling Legend',
          text: 'Check out my Ultimate Hurling Legend Card! #BeyondThePitch'
        });
      } catch (err) { console.error("Share failed", err); }
    } else { alert("Save the image manually to share on Instagram."); }
  });
}
</script>
</body>
</html>

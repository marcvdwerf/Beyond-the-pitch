<!DOCTYPE html>
<html lang="nl">
<head>
<style>
  body { background: #050505; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }

  /* Het Pakje */
  #pack-wrapper { cursor: pointer; text-align: center; transition: transform 0.3s; }
  #pack-wrapper:hover { transform: scale(1.05); }
  
  .pack {
    width: 200px; height: 300px;
    background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
    border-radius: 10px; border: 4px solid #fff;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
  }

  /* De Shaking Animatie voor de klik */
  .shake { animation: shakeAnim 0.5s ease-in-out; }
  @keyframes shakeAnim {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-10px, 10px); }
    40% { transform: translate(10px, -10px); }
    60% { transform: translate(-10px, -10px); }
    80% { transform: translate(10px, 10px); }
    100% { transform: translate(0, 0); }
  }

  /* Het Onthullingsscherm */
  #reveal-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, #222 0%, #000 100%);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }

  /* De Speler Kaart die binnenkomt */
  .player-card {
    width: 320px; height: 480px;
    background: white; color: #111; border-radius: 20px;
    border: 8px solid #ffd700; position: relative;
    transform: scale(0.5); opacity: 0;
    transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .player-card.show { transform: scale(1); opacity: 1; }

  .burst {
    position: absolute; width: 100%; height: 100%;
    background: white; border-radius: 50%; opacity: 0;
    z-index: 99; pointer-events: none;
  }
  .flash-active { animation: flashAnim 0.6s ease-out; }
  @keyframes flashAnim {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(4); opacity: 0; }
  }

  .player-img { width: 100%; height: 60%; object-fit: cover; border-bottom: 5px solid #ffd700; border-radius: 12px 12px 0 0; }
  .rating { position: absolute; top: 20px; left: 20px; font-size: 40px; color: #b8860b; }
</style>
</head>
<body>

  <div id="pack-wrapper" onclick="openPack()">
    <div class="pack" id="main-pack">
      <h1 style="margin:0;">ULTIMATE</h1>
      <p>HURLING</p>
      <div style="font-size: 40px;">✨</div>
    </div>
    <p>KLIK OM TE OPENEN</p>
  </div>

  <div id="reveal-screen">
    <div class="burst" id="flash"></div>
    <div class="player-card" id="card">
      <div class="rating">94</div>
      <img src="https://via.placeholder.com/400x600?text=Cian+Lynch" class="player-img">
      <div style="padding: 20px; text-align: center;">
        <h2 style="margin:0; font-size: 30px;">Cian Lynch</h2>
        <p style="color: #666;">LIMERICK | MIDFIELD</p>
        <button onclick="resetPack()" style="padding:10px 20px; cursor:pointer; background:#ffd700; border:none; font-weight:bold; border-radius:5px;">SLUITEN</button>
      </div>
    </div>
  </div>

<script>
  function openPack() {
    const pack = document.getElementById('pack-wrapper');
    const screen = document.getElementById('reveal-screen');
    const card = document.getElementById('card');
    const flash = document.getElementById('flash');

    // 1. Schud het pakje
    pack.classList.add('shake');

    // 2. Na een korte vertraging, doe de "flash" en toon de kaart
    setTimeout(() => {
      pack.style.display = 'none';
      screen.style.display = 'flex';
      flash.classList.add('flash-active');
      
      // 3. Laat de kaart binnenvliegen
      setTimeout(() => {
        card.classList.add('show');
      }, 100);
    }, 600);
  }

  function resetPack() {
    location.reload(); // Simpele manier om terug naar het begin te gaan
  }
</script>

</body>
</html>

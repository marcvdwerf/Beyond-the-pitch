<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    /* Home Knop Styling */
    .home-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-weight: bold;
      transition: 0.3s;
      z-index: 1000; /* Zorg dat hij altijd bovenop ligt */
    }
    .home-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: #d4af37; }

    /* Bestaande Kaart & Pack Styling */
    .pack { width: 180px; height: 260px; background: linear-gradient(135deg, #d4af37, #b8860b); border: 4px solid #fff; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
    .pack:hover { transform: scale(1.05); }

    .card-to-download {
      width: 300px; height: 440px;
      background: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #b8860b 100%);
      border-radius: 20px; border: 5px solid #fff; position: relative;
      color: #111; display: none; margin-bottom: 20px;
    }

    .player-img { width: 100%; height: 240px; object-fit: cover; }
    .card-info { padding: 15px; background: white; height: 100%; }

    .btn-container { display: flex; gap: 10px; }
    .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
    .btn-next { background: #d4af37; }
    .btn-download { background: #27ae60; color: white; display: none; }
  </style>
</head>
<body>

  <a href="index.html" class="home-btn">🏠 Home</a>

  <div id="pack" class="pack" onclick="revealLegend()">
    HURLING LEGENDS
  </div>

  <div id="legendCard" class="card-to-download">
    <div style="position:absolute; top:10px; left:15px; font-size:35px; font-weight:900;" id="cardRating">99</div>
    <img src="" id="cardImg" class="player-img">
    <div class="card-info">
      <h2 id="cardName" style="margin:0;">Naam</h2>
      <p id="cardTeam" style="margin:5px 0; color: #555;">Team</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 14px;">
        <div id="stat1">PAC: 90</div><div id="stat2">SHT: 90</div>
        <div id="stat3">PHY: 90</div><div id="stat4">SKL: 90</div>
      </div>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn btn-next" id="nextBtn" style="display:none;" onclick="location.reload()">VOLGENDE PACK</button>
    <button class="btn btn-download" id="downloadBtn" onclick="downloadCard()">DOWNLOAD PNG</button>
  </div>

<script>
  const legends = [
    { name: "Henry Shefflin", team: "Kilkenny", rating: 98, stats: [92, 99, 94, 97], img: "https://via.placeholder.com/300x240?text=Henry+Shefflin" },
    { name: "Christy Ring", team: "Cork", rating: 99, stats: [90, 99, 98, 99], img: "https://via.placeholder.com/300x240?text=Christy+Ring" },
    { name: "Joe Canning", team: "Galway", rating: 96, stats: [88, 97, 92, 98], img: "https://via.placeholder.com/300x240?text=Joe+Canning" },
    { name: "DJ Carey", team: "Kilkenny", rating: 96, stats: [95, 94, 85, 98], img: "https://via.placeholder.com/300x240?text=DJ+Carey" }
  ];

  function revealLegend() {
    const randomLegend = legends[Math.floor(Math.random() * legends.length)];
    document.getElementById('cardName').innerText = randomLegend.name;
    document.getElementById('cardTeam').innerText = randomLegend.team;
    document.getElementById('cardRating').innerText = randomLegend.rating;
    document.getElementById('cardImg').src = randomLegend.img;
    document.getElementById('stat1').innerText = "PAC: " + randomLegend.stats[0];
    document.getElementById('stat2').innerText = "SHT: " + randomLegend.stats[1];
    document.getElementById('stat3').innerText = "PHY: " + randomLegend.stats[2];
    document.getElementById('stat4').innerText = "SKL: " + randomLegend.stats[3];

    document.getElementById('pack').style.display = 'none';
    document.getElementById('legendCard').style.display = 'block';
    document.getElementById('downloadBtn').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'block';
  }

  function downloadCard() {
    const card = document.getElementById('legendCard');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = 'hurling-legend.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>

</body>
</html>

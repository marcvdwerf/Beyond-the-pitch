<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurling Legends Unboxing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --gold: #d4af37;
      --gold-bright: #f9f295;
      --dark: #0a0a0a;
    }

    body { 
      background: var(--dark); 
      color: white; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      margin: 0; 
      overflow: hidden; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }

    /* Home Knop */
    .home-btn {
      position: absolute; top: 20px; left: 20px;
      padding: 12px 20px; background: rgba(255, 255, 255, 0.1);
      color: white; text-decoration: none; border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-weight: bold; transition: 0.3s; z-index: 1000;
    }
    .home-btn:hover { background: var(--gold); color: black; border-color: white; }

    /* Pack Styling */
    #pack-area { text-align: center; cursor: pointer; }
    .pack {
      width: 220px; height: 320px;
      background: linear-gradient(135deg, #222, #444);
      border: 4px solid var(--gold); border-radius: 15px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      transition: transform 0.3s;
    }
    .pack:hover { transform: scale(1.05) rotate(1deg); }
    .pack h2 { color: var(--gold); margin: 0; letter-spacing: 2px; }

    /* De Kaart (FIFA Style) */
    .card-to-download {
      width: 320px; height: 480px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold) 100%);
      border-radius: 20px; border: 6px solid #fff; position: relative;
      color: #111; display: none; overflow: hidden;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
    }

    /* Glimmer effect voor social media */
    .card-to-download::after {
      content: ""; position: absolute; top: -150%; left: -150%;
      width: 300%; height: 300%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: rotate(45deg); animation: shimmer 4s infinite;
    }
    @keyframes shimmer { 0% { top: -150%; left: -150%; } 100% { top: 150%; left: 150%; } }

    .player-img { width: 100%; height: 260px; object-fit: cover; background: #ddd; border-bottom: 4px solid #fff; }
    .card-content { padding: 15px; background: white; height: 100%; text-align: center; }
    .rating-big { position: absolute; top: 15px; left: 15px; font-size: 50px; font-weight: 900; z-index: 10; }

    /* Knoppen onder de kaart */
    .controls { display: none; margin-top: 20px; gap: 10px; }
    .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-next { background: var(--gold); color: black; }
    .btn-save { background: #27ae60; color: white; }

    /* Special Flash voor 98+ ratings */
    .epic-flash { animation: flashScreen 0.5s ease-out; }
    @keyframes flashScreen { 0% { background: white; } 100% { background: var(--dark); } }
  </style>
</head>
<body>

  <a href="index.html" class="home-btn">🏠 Terug naar Home</a>

  <div id="pack-area" onclick="openPack()">
    <div class="pack">
      <div style="font-size: 50px; margin-bottom: 10px;">🏆</div>
      <h2>LEGENDS</h2>
      <p style="color:white; opacity:0.7;">TIK OM TE OPENEN</p>
    </div>
  </div>

  <div id="legendCard" class="card-to-download">
    <div class="rating-big" id="cardRating">99</div>
    <img src="" id="cardImg" class="player-img">
    <div class="card-content">
      <h2 id="cardName" style="margin:5px 0; font-size: 28px;">Naam</h2>
      <p id="cardTeam" style="margin:0; color: #666; font-weight: bold;">TEAM</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; font-weight: 900; border-top: 1px solid #eee; padding-top: 15px;">
        <div id="s1">PAC: 90</div><div id="s2">SHT: 90</div>
        <div id="s3">PHY: 90</div><div id="s4">SKL: 90</div>
      </div>
      <p style="font-size: 10px; color: #ccc; margin-top: 10px;">Gemaakt op JouwWebsite.nl</p>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn btn-next" onclick="location.reload()">VOLGENDE PACK</button>
    <button class="btn btn-save" onclick="downloadImage()">DOWNLOAD VOOR SOCIALS</button>
  </div>

<script>
  // De Database met 30 Legends (voorbeeldset, makkelijk aan te vullen)
  const legends = [
    { name: "Henry Shefflin", team: "Kilkenny", rat: 98, stats: [92, 99, 94, 97], img: "https://via.placeholder.com/320x260?text=Henry+Shefflin" },
    { name: "Christy Ring", team: "Cork", rat: 99, stats: [90, 99, 98, 99], img: "https://via.placeholder.com/320x260?text=Christy+Ring" },
    { name: "Joe Canning", team: "Galway", rat: 96, stats: [88, 97, 92, 98], img: "https://via.placeholder.com/320x260?text=Joe+Canning" },
    { name: "Eddie Keher", team: "Kilkenny", rat: 97, stats: [85, 99, 88, 96], img: "https://via.placeholder.com/320x260?text=Eddie+Keher" },
    { name: "DJ Carey", team: "Kilkenny", rat: 96, stats: [95, 94, 85, 98], img: "https://via.placeholder.com/320x260?text=DJ+Carey" },
    { name: "Nicky Rackard", team: "Wexford", rat: 95, stats: [82, 98, 96, 91], img: "https://via.placeholder.com/320x260?text=Nicky+Rackard" }
    // Voeg hier de rest van je 30 namen toe...
  ];

  function openPack() {
    const random = legends[Math.floor(Math.random() * legends.length)];
    
    // Update de kaart info
    document.getElementById('cardName').innerText = random.name;
    document.getElementById('cardTeam').innerText = random.team.toUpperCase();
    document.getElementById('cardRating').innerText = random.rat;
    document.getElementById('cardImg').src = random.img;
    document.getElementById('s1').innerText = "PAC: " + random.stats[0];
    document.getElementById('s2').innerText = "SHT: " + random.stats[1];
    document.getElementById('s3').innerText = "PHY: " + random.stats[2];
    document.getElementById('s4').innerText = "SKL: " + random.stats[3];

    // Animatie volgorde
    if(random.rat >= 98) document.body.classList.add('epic-flash');

    document.getElementById('pack-area').style.display = 'none';
    document.getElementById('legendCard').style.display = 'block';
    
    setTimeout(() => {
      document.getElementById('controls').style.display = 'flex';
    }, 500);
  }

  function downloadImage() {
    const card = document.getElementById('legendCard');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = `Legend_${document.getElementById('cardName').innerText}.png`;
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>

</body>
</html>

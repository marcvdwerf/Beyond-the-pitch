<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurling Legends | Ultimate Unboxing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --gold: #d4af37;
      --gold-bright: #f9f295;
      --dark: #0a0a0a;
      --card-white: rgba(255,255,255,0.95);
    }

    body { 
      background: var(--dark); 
      color: white; 
      font-family: 'Montserrat', sans-serif; 
      margin: 0; 
      overflow: hidden; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }

    /* Home Button */
    .home-btn {
      position: absolute; top: 20px; left: 20px;
      padding: 12px 20px; background: rgba(255, 255, 255, 0.1);
      color: white; text-decoration: none; border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-weight: bold; transition: 0.3s; z-index: 1000;
    }

    /* Pack Styling & Animations */
    #pack-area { text-align: center; cursor: pointer; position: relative; }
    
    .pack {
      width: 220px; height: 320px;
      background: linear-gradient(135deg, #1a1a1a, #333);
      border: 4px solid var(--gold); border-radius: 15px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
      position: relative;
    }

    /* Intense Shake Animation */
    .shake-active { animation: shake 0.1s infinite; }
    .glow-active { animation: intenseGlow 5s forwards; }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(-1deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      80% { transform: translate(1px, 1px) rotate(-1deg); }
      100% { transform: translate(-1px, -2px) rotate(1deg); }
    }

    @keyframes intenseGlow {
      0% { box-shadow: 0 0 20px var(--gold); }
      50% { box-shadow: 0 0 60px var(--gold-bright); }
      100% { box-shadow: 0 0 150px white; transform: scale(1.1); }
    }

    /* Screen Flash */
    #flash-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: white; opacity: 0; pointer-events: none; z-index: 2000;
    }
    .flash-trigger { animation: flashEffect 0.6s ease-out; }
    @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

    /* The Legend Card */
    .card-to-download {
      width: 320px; height: 480px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold) 100%);
      border-radius: 20px; border: 6px solid #fff; position: relative;
      color: #111; display: none; overflow: hidden;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.6);
      z-index: 5;
    }

    .player-img { width: 100%; height: 260px; object-fit: cover; border-bottom: 4px solid #fff; }
    .card-content { padding: 15px; background: var(--card-white); height: 100%; text-align: center; }
    .rating-big { position: absolute; top: 15px; left: 15px; font-size: 55px; font-weight: 900; z-index: 10; color: #111; }

    .controls { display: none; margin-top: 25px; gap: 15px; }
    .btn { padding: 14px 28px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-next { background: var(--gold); color: black; }
    .btn-save { background: #1da1f2; color: white; }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <a href="index.html" class="home-btn">🏠 Home</a>

  <div id="pack-area" onclick="initiateOpening()">
    <div class="pack" id="main-pack">
      <div style="font-size: 60px; margin-bottom: 10px;">⚡</div>
      <h2>LEGENDS</h2>
      <p id="status-text" style="color:white; opacity:0.8; font-size: 12px; margin-top: 10px;">TAP TO UNBOX</p>
    </div>
  </div>

  <div id="legendCard" class="card-to-download">
    <div class="rating-big" id="cardRating">99</div>
    <img src="" id="cardImg" class="player-img">
    <div class="card-content">
      <h2 id="cardName" style="margin:5px 0; font-size: 28px; text-transform: uppercase;">Player Name</h2>
      <p id="cardTeam" style="margin:0; color: #d4af37; font-weight: bold; font-size: 14px;">COUNTY</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; font-weight: 900; border-top: 2px solid #ddd; padding-top: 15px; font-size: 18px;">
        <div id="s1">PAC: 90</div><div id="s2">SHT: 90</div>
        <div id="s3">PHY: 90</div><div id="s4">SKL: 90</div>
      </div>
      <p style="font-size: 10px; color: #999; margin-top: 15px;">HURLINGLEGENDS.COM</p>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn btn-next" onclick="location.reload()">Next Pack</button>
    <button class="btn btn-save" onclick="downloadImage()">Download Card</button>
  </div>

  function initiateOpening() {
    const pack = document.getElementById('main-pack');
    const status = document.getElementById('status-text');
    const flash = document.getElementById('flash-overlay');

    // Start build-up
    document.getElementById('pack-area').onclick = null; // Disable multiple clicks
    status.innerText = "OPENING...";
    pack.classList.add('shake-active', 'glow-active');

    // 5 seconds build-up
    setTimeout(() => {
      flash.classList.add('flash-trigger');
      
      setTimeout(() => {
        revealLegend();
      }, 300); // Reveal card during the peak of the flash
    }, 5000); 
  }

  function revealLegend() {
    const random = legends[Math.floor(Math.random() * legends.length)];
    
    document.getElementById('cardName').innerText = random.name;
    document.getElementById('cardTeam').innerText = random.team.toUpperCase();
    document.getElementById('cardRating').innerText = random.rat;
    document.getElementById('cardImg').src = random.img;
    document.getElementById('s1').innerText = "PAC: " + random.stats[0];
    document.getElementById('s2').innerText = "SHT: " + random.stats[1];
    document.getElementById('s3').innerText = "PHY: " + random.stats[2];
    document.getElementById('s4').innerText = "SKL: " + random.stats[3];

    document.getElementById('pack-area').style.display = 'none';
    document.getElementById('legendCard').style.display = 'block';
    
    setTimeout(() => {
      document.getElementById('controls').style.display = 'flex';
    }, 500);
  }

  function downloadImage() {
    const card = document.getElementById('legendCard');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = `Legend_${document.getElementById('cardName').innerText}.png`;
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>

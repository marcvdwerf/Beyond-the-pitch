<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hurling Legends | Premium Unboxing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #c9a84c;
      --gold-bright: #f0d060;
      --gold-dark: #7a5c1a;
      --cream: #f5e9c8;
      --dark: #060608;
      --card-bg-top: #1a110a;
      --card-bg-bottom: #0e0a05;
    }

    body { 
      background: radial-gradient(ellipse at 50% 30%, #1c1408 0%, #060608 70%); 
      color: white; 
      font-family: 'Rajdhani', sans-serif; 
      margin: 0; 
      overflow: hidden; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      touch-action: manipulation;
    }

    .home-btn {
      position: absolute; top: 15px; left: 15px;
      padding: 10px 18px; background: rgba(201,168,76,0.1);
      color: var(--gold); text-decoration: none; border-radius: 6px;
      border: 1px solid rgba(201,168,76,0.4);
      font-weight: bold; z-index: 1000;
      font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
      font-family: 'Orbitron', sans-serif;
    }

    .header-info { position: absolute; top: 72px; text-align: center; width: 100%; }
    .credits-display {
      font-family: 'Orbitron'; color: var(--gold); font-size: 12px;
      border: 1px solid rgba(201,168,76,0.35); padding: 5px 16px; border-radius: 20px;
      background: rgba(0,0,0,0.6); display: inline-block; letter-spacing: 2px;
    }

    #pack-area { 
      position: relative; width: 100%; display: flex; justify-content: center; cursor: pointer; 
    }
    .pack-wrapper {
      position: relative; width: 70vw; max-width: 260px; height: auto; 
      aspect-ratio: 2/3; transition: 0.4s; animation: float 4s ease-in-out infinite;
    }
    .pack-visual {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(201,168,76,0.25));
    }

    /* ══════════════════════════════════════
       PREMIUM CARD
    ══════════════════════════════════════ */
    #card-container { 
      perspective: 1200px; display: none; 
      width: 85vw; max-width: 320px; aspect-ratio: 2/3; 
    }
    .card-inner { 
      position: relative; width: 100%; height: 100%; 
      transition: transform 1.3s cubic-bezier(0.4, 0, 0.2, 1); 
      transform-style: preserve-3d; 
    }
    .is-flipped { transform: rotateY(180deg); }
    .card-face { 
      position: absolute; width: 100%; height: 100%; 
      backface-visibility: hidden; border-radius: 12px; overflow: hidden; 
    }

    /* Card Back */
    .card-back { 
      background: #0a0a0a; 
      display: flex; justify-content: center; align-items: center; 
      border: 2px solid var(--gold);
      box-shadow: inset 0 0 40px rgba(201,168,76,0.05);
    }
    .card-back::before {
      content: '';
      position: absolute; inset: 4px;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 9px;
      pointer-events: none;
    }
    .card-back img { width: 55%; filter: drop-shadow(0 0 12px rgba(201,168,76,0.4)); }

    /* Card Front — THE PREMIUM PART */
    .card-front { 
      transform: rotateY(180deg); 
      background: linear-gradient(165deg, #1e1408 0%, #120d04 40%, #0c0805 100%);
      border: 3px solid var(--gold);
      position: relative;
    }

    /* Inner border line */
    .card-front::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 8px;
      border: 1px solid rgba(201,168,76,0.25);
      pointer-events: none;
      z-index: 10;
    }

    /* Top section — dark with player photo */
    .card-top {
      position: relative;
      height: 58%;
      overflow: hidden;
      background: linear-gradient(180deg, #1a0f06 0%, #100a03 100%);
    }

    /* Subtle hex/diamond pattern bg */
    .card-top::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        repeating-linear-gradient(60deg, transparent, transparent 14px, rgba(201,168,76,0.03) 14px, rgba(201,168,76,0.03) 15px),
        repeating-linear-gradient(-60deg, transparent, transparent 14px, rgba(201,168,76,0.03) 14px, rgba(201,168,76,0.03) 15px);
      z-index: 0;
    }

    /* Gold diagonal accent — top left corner */
    .card-top::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
      z-index: 3;
    }

    .player-img { 
      width: 100%; height: 100%; 
      object-fit: contain; object-position: bottom center;
      position: relative; z-index: 2;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
    }

    /* Rating badge — top left */
    .rating-big { 
      position: absolute; top: 8%; left: 6%; 
      z-index: 10;
      text-align: center;
    }
    .rating-number {
      display: block;
      font-size: clamp(34px, 10vw, 46px); 
      font-family: 'Orbitron', sans-serif; 
      font-weight: 900; 
      color: var(--gold-bright);
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .rating-pos {
      display: block;
      font-size: 10px;
      font-family: 'Orbitron', sans-serif;
      color: rgba(201,168,76,0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Rarity badge — top right */
    .rarity-badge {
      position: absolute; top: 9%; right: 6%;
      z-index: 10;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #0a0700;
      font-family: 'Orbitron', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 8px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    /* Bottom content section */
    .card-content { 
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 44%;
      background: linear-gradient(180deg, #0e0a04 0%, #080501 100%);
      padding: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
    }

    /* Gold divider line between photo and info */
    .card-divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 20%, var(--gold-bright) 50%, var(--gold) 80%, transparent 100%);
      flex-shrink: 0;
    }

    /* Name & county block */
    .card-identity {
      text-align: center;
      padding: 8px 12px 6px;
      flex-shrink: 0;
    }
    #cardName { 
      margin: 0; 
      font-size: clamp(14px, 4.5vw, 19px); 
      font-family: 'Cinzel', serif;
      font-weight: 900;
      color: var(--cream);
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      line-height: 1.1;
    }
    #cardTeam { 
      margin: 3px 0 0; 
      font-weight: 700; 
      color: var(--gold); 
      font-size: 10px; 
      letter-spacing: 3px;
      font-family: 'Orbitron', sans-serif;
    }

    /* Stats divider */
    .stats-divider {
      margin: 0 12px;
      height: 1px;
      background: rgba(201,168,76,0.2);
      flex-shrink: 0;
    }

    /* Stats grid */
    .stats-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr 1fr 1fr; 
      gap: 0;
      padding: 8px 8px 6px;
      flex: 1;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(201,168,76,0.12);
    }
    .stat-item:last-child { border-right: none; }
    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 700;
      color: var(--cream);
      line-height: 1;
    }
    .stat-label {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 1px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Footer */
    .card-footer {
      text-align: center;
      padding-bottom: 8px;
      flex-shrink: 0;
    }
    .card-footer p {
      font-size: 8px;
      font-weight: bold;
      margin: 0;
      letter-spacing: 2px;
      color: rgba(201,168,76,0.35);
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }

    /* Controls */
    .controls { display: none; margin-top: 20px; width: 90%; gap: 10px; flex-direction: column; align-items: center; }
    .btn { 
      width: 100%; max-width: 280px; padding: 14px; border: none; 
      font-family: 'Orbitron'; font-weight: bold; cursor: pointer; 
      font-size: 12px; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
      letter-spacing: 1px;
    }
    .btn-next { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #0a0700; }
    .btn-save { background: rgba(255,255,255,0.05); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); clip-path: none; border-radius: 4px; }
    .btn-share { 
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); 
      color: white; font-size: 13px;
    }

    #out-of-credits { display: none; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 1px solid rgba(201,168,76,0.4); width: 80%; }
    
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 3000; }
    .flash-trigger { animation: flashEffect 0.8s ease-out; }
    @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    .shake-active { animation: shake 0.15s infinite !important; }
    @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-3px, -1px); } }

    @media (min-width: 600px) {
      .controls { flex-direction: row; }
      .btn { width: auto; }
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <a href="/gaelic-games/" class="home-btn">🏠 Home</a>

  <div class="header-info">
    <div class="credits-display">CREDITS: <span id="credit-count">3</span> / 3</div>
  </div>

  <div id="out-of-credits">
    <h2 style="font-family: 'Orbitron'; color: var(--gold); margin-bottom: 10px;">LIMIT REACHED</h2>
    <p style="font-size: 14px;">You've opened all premium packs for this session.</p>
  </div>

  <div id="pack-area" onclick="initiateOpening()">
    <div id="main-pack" class="pack-wrapper">
      <img src="images/afbeelding-pakket.png" class="pack-visual">
    </div>
  </div>

  <div id="card-container">
    <div class="card-inner" id="cardInner">
      <!-- Back -->
      <div class="card-face card-back">
        <img src="images/afbeelding-pakket.png" alt="Hurling Legends unboxing package">
      </div>
      <!-- Front -->
      <div class="card-face card-front" id="legendCard">
        <div class="card-top">
          <!-- Rating top-left -->
          <div class="rating-big">
            <span class="rating-number" id="cardRating">99</span>
            <span class="rating-pos" id="cardPos">HRL</span>
          </div>
          <!-- Rarity top-right -->
          <div class="rarity-badge" id="rarityBadge">LEGEND</div>
          <!-- Player image -->
          <img src="" id="cardImg" class="player-img" alt="">
        </div>
        <div class="card-content">
          <div class="card-divider"></div>
          <div class="card-identity">
            <h2 id="cardName">NAME</h2>
            <p id="cardTeam">COUNTY</p>
          </div>
          <div class="stats-divider"></div>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="s1v">90</span>
              <span class="stat-label">PAC</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="s2v">90</span>
              <span class="stat-label">SHT</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="s3v">90</span>
              <span class="stat-label">PHY</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="s4v">90</span>
              <span class="stat-label">SKL</span>
            </div>
          </div>
          <div class="card-footer">
            <p>TRAVELBEYONDTHEPITCH.COM</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn btn-share" onclick="shareToStory()">SHARE TO INSTAGRAM</button>
    <button class="btn btn-next" onclick="tryAgain()">NEXT PACK</button>
    <button class="btn btn-save" onclick="downloadImage()">SAVE PNG</button>
  </div>

<script>
let credits = 3;
const legends = [
  { name: "Henry Shefflin", team: "Kilkenny", rat: 98, stats: [88, 99, 94, 97], img: "images/henry-shefflin-kilkenny-hurling.jpg" },
  { name: "Christy Ring", team: "Cork", rat: 99, stats: [91, 99, 98, 99], img: "images/christy-ring-cork-hurling.jpg" },
  { name: "Joe Canning", team: "Galway", rat: 96, stats: [82, 98, 92, 98], img: "images/joe-canning-galway-hurling.jpg" },
  { name: "Eddie Keher", team: "Kilkenny", rat: 97, stats: [84, 99, 87, 95], img: "images/eddie-keher-kilkenny-hurling.jpg" },
  { name: "Nicky Rackard", team: "Wexford", rat: 96, stats: [80, 99, 97, 90], img: "images/nicky-rackard-wexford-hurling.jpg" },
  { name: "Jimmy Doyle", team: "Tipperary", rat: 95, stats: [86, 96, 82, 97], img: "images/jimmy-doyle-tipperary-hurling.jpg" },
  { name: "Mick Mackey", team: "Limerick", rat: 96, stats: [88, 94, 98, 92], img: "images/mick-mackey-limerick-hurling.jpg" },
  { name: "Brian Whelahan", team: "Offaly", rat: 95, stats: [85, 88, 90, 96], img: "images/brian-whelahan-offaly-hurling.jpg" },
  { name: "Ken McGrath", team: "Waterford", rat: 94, stats: [84, 87, 95, 92], img: "images/ken-mcgrath-waterford-hurling.jpg" },
  { name: "T.J. Reid", team: "Kilkenny", rat: 95, stats: [80, 97, 89, 96], img: "images/tj-reid-kilkenny-hurling.jpg" },
  { name: "Patrick Horgan", team: "Cork", rat: 93, stats: [83, 96, 82, 95], img: "images/patrick-horgan-cork-hurling.jpg" },
  { name: "John Doyle", team: "Tipperary", rat: 95, stats: [82, 80, 99, 88], img: "images/john-doyle-tipperary-hurling.jpg" },
  { name: "Brian Corcoran", team: "Cork", rat: 94, stats: [82, 85, 96, 93], img: "images/brian-corcoran-cork-hurling.jpg" },
  { name: "Tony Keady", team: "Galway", rat: 93, stats: [84, 86, 95, 90], img: "images/tony-keady-galway-hurling.jpg" },
  { name: "Pádraic Maher", team: "Tipperary", rat: 93, stats: [82, 82, 97, 88], img: "images/padraic-maher-tipperary-hurling.jpg" },
  { name: "JJ Delaney", team: "Kilkenny", rat: 96, stats: [86, 75, 94, 98], img: "images/jj-delaney-kilkenny-hurling.jpg" },
  { name: "Cian Lynch", team: "Limerick", rat: 94, stats: [87, 85, 88, 99], img: "images/cian-lynch-limerick-hurling.jpg" },
  { name: "Eoin Kelly", team: "Tipperary", rat: 94, stats: [85, 97, 84, 94], img: "images/eoin-kelly-tipperary-hurling.jpg" },
  { name: "Tommy Walsh", team: "Kilkenny", rat: 95, stats: [88, 84, 92, 95], img: "images/tommy-walsh-kilkenny-hurling.jpg" },
  { name: "Babs Keating", team: "Tipperary", rat: 92, stats: [82, 91, 88, 93], img: "images/babs-keating-tipperary-hurling.jpg" },
  { name: "Dan Shanahan", team: "Waterford", rat: 91, stats: [86, 93, 94, 85], img: "images/dan-shanahan-waterford-hurling.jpg" },
  { name: "Jack Lynch", team: "Cork", rat: 94, stats: [85, 89, 90, 94], img: "images/jack-lynch-cork-hurling.jpg" },
  { name: "Frank Cummins", team: "Kilkenny", rat: 93, stats: [82, 84, 96, 89], img: "images/frank-cummins-kilkenny-hurling.jpg" },
  { name: "Tony Doran", team: "Wexford", rat: 91, stats: [78, 92, 95, 84], img: "images/tony-doran-wexford-hurling.jpg" },
  { name: "Michael Kavanagh", team: "Kilkenny", rat: 92, stats: [82, 94, 88, 91], img: "images/michael-kavanagh-kilkenny-hurling.jpg" }
];

function getRarity(rat) {
  if (rat >= 98) return "ICON";
  if (rat >= 96) return "LEGEND";
  if (rat >= 94) return "ELITE";
  return "GOLD";
}

function initiateOpening() {
  if (credits <= 0) return;
  credits--;
  document.getElementById('credit-count').innerText = credits;
  
  const pack = document.getElementById('main-pack');
  const flash = document.getElementById('flash-overlay');
  document.getElementById('pack-area').onclick = null;
  pack.classList.add('shake-active');

  setTimeout(() => {
    flash.classList.add('flash-trigger');
    setTimeout(revealLegend, 400);
  }, 3500); 
}

function revealLegend() {
  const random = legends[Math.floor(Math.random() * legends.length)];
  document.getElementById('cardName').innerText = random.name;
  document.getElementById('cardTeam').innerText = random.team.toUpperCase();
  document.getElementById('cardRating').innerText = random.rat;
  document.getElementById('cardPos').innerText = 'HRL';
  document.getElementById('rarityBadge').innerText = getRarity(random.rat);
  document.getElementById('cardImg').src = random.img;
  document.getElementById('s1v').innerText = random.stats[0];
  document.getElementById('s2v').innerText = random.stats[1];
  document.getElementById('s3v').innerText = random.stats[2];
  document.getElementById('s4v').innerText = random.stats[3];

  document.getElementById('pack-area').style.display = 'none';
  document.getElementById('card-container').style.display = 'block';

  setTimeout(() => {
    document.getElementById('cardInner').classList.add('is-flipped');
    setTimeout(() => { document.getElementById('controls').style.display = 'flex'; }, 1000);
  }, 100);
}

function tryAgain() {
  if (credits > 0) {
    document.getElementById('cardInner').classList.remove('is-flipped');
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('pack-area').style.display = 'flex';
    document.getElementById('pack-area').onclick = initiateOpening;
    document.getElementById('main-pack').classList.remove('shake-active');
  } else {
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('out-of-credits').style.display = 'block';
  }
}

function downloadImage() {
  const card = document.getElementById('legendCard');
  html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = `Legend_${document.getElementById('cardName').innerText}.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
}

async function shareToStory() {
  const card = document.getElementById('legendCard');
  const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true });
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'LegendCard.png', { type: 'image/png' });
    if (navigator.share) {
      try {
        await navigator.share({ files: [file], title: 'My Hurling Legend', text: 'Check out my Ultimate Hurling Legend Card! #BeyondThePitch' });
      } catch (err) { console.error("Share failed", err); }
    } else { alert("Save the image manually to share on Instagram."); }
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hurling Legends | Premium Unboxing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #d4af37;
      --gold-bright: #f9f295;
      --dark: #050505;
    }

    body { 
      background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); 
      color: white; 
      font-family: 'Rajdhani', sans-serif; 
      margin: 0; 
      overflow: hidden; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      touch-action: manipulation;
    }

    /* Home Knop - Verbinding naar hoofdmap */
    .home-btn {
      position: absolute; top: 15px; left: 15px;
      padding: 12px 20px; background: rgba(255, 255, 255, 0.1);
      color: white; text-decoration: none; border-radius: 8px;
      border: 1px solid var(--gold);
      font-weight: bold; z-index: 1000;
      font-size: 14px; text-transform: uppercase;
    }

    /* Header & Credits */
    .header-info { position: absolute; top: 75px; text-align: center; width: 100%; }
    .credits-display {
      font-family: 'Orbitron'; color: var(--gold); font-size: 14px;
      border: 1px solid var(--gold); padding: 6px 15px; border-radius: 20px;
      background: rgba(0,0,0,0.7); display: inline-block;
    }

    /* Pack Area - CLEAN LOOK (Geen vierkant meer) */
    #pack-area { 
      position: relative; 
      width: 100%; 
      display: flex; 
      justify-content: center; 
      cursor: pointer; 
    }
    .pack-wrapper {
      position: relative; 
      width: 70vw; 
      max-width: 260px; 
      height: auto; 
      aspect-ratio: 2/3;
      transition: 0.4s; 
      animation: float 4s ease-in-out infinite;
    }
    .pack-visual {
      width: 100%; 
      height: 100%; 
      object-fit: contain; /* Houdt de vorm van het zakje aan */
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3)); /* Gouden gloed ipv zwarte bak */
    }

    /* Card 3D Flip */
    #card-container { perspective: 1000px; display: none; width: 85vw; max-width: 330px; aspect-ratio: 2/3; }
    .card-inner { position: relative; width: 100%; height: 100%; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .is-flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 5px solid #fff; overflow: hidden; }
    
    .card-back { background: #111; display: flex; justify-content: center; align-items: center; border: 5px solid var(--gold); }
    .card-back img { width: 60%; filter: drop-shadow(0 0 10px var(--gold)); }
    
    .card-front { background: linear-gradient(135deg, #b8860b 0%, #fbdf93 50%, #b8860b 100%); color: #111; transform: rotateY(180deg); }
    .player-img { width: 100%; height: 55%; object-fit: contain; margin-top: 10%; position: relative; z-index: 2; }
    .card-content { padding: 10px; text-align: center; background: rgba(255, 255, 255, 0.95); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
    .rating-big { position: absolute; top: 10%; left: 8%; font-size: clamp(40px, 12vw, 55px); font-family: 'Orbitron'; font-weight: 900; z-index: 10; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 5px; font-weight: 700; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 8px; font-size: 16px; }

    /* Controls */
    .controls { display: none; margin-top: 20px; width: 90%; gap: 10px; flex-direction: column; align-items: center; }
    .btn { 
      width: 100%; max-width: 280px; padding: 15px; border: none; 
      font-family: 'Orbitron'; font-weight: bold; cursor: pointer; 
      font-size: 14px; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
    }
    .btn-next { background: var(--gold); color: black; }
    .btn-save { background: #fff; color: black; }
    .btn-share { 
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); 
      color: white; font-size: 16px;
    }

    #out-of-credits { display: none; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 2px solid var(--gold); width: 80%; }
    
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 3000; }
    .flash-trigger { animation: flashEffect 0.8s ease-out; }
    @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    .shake-active { animation: shake 0.15s infinite !important; }
    @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-3px, -1px); } }

    @media (min-width: 600px) {
      .controls { flex-direction: row; }
      .btn { width: auto; }
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <a href="/gaelic-games/" class="home-btn">🏠 Home</a>

  <div class="header-info">
    <div class="credits-display">CREDITS: <span id="credit-count">3</span> / 3</div>
  </div>

  <div id="out-of-credits">
    <h2 style="font-family: 'Orbitron'; color: var(--gold); margin-bottom: 10px;">LIMIT REACHED</h2>
    <p style="font-size: 14px;">You've opened all premium packs for this session.</p>
  </div>

  <div id="pack-area" onclick="initiateOpening()">
    <div id="main-pack" class="pack-wrapper">
      <img src="images/afbeelding-pakket.png" class="pack-visual">
    </div>
  </div>

  <div id="card-container">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-back">
         <img src="images/afbeelding-pakket.png" alt="hurling Legends unboxing package game Ireland">
      </div>
      <div class="card-face card-front" id="legendCard">
        <div class="rating-big" id="cardRating">99</div>
        <img src="" id="cardImg" class="player-img">
        <div class="card-content">
          <h2 id="cardName" style="margin:0; font-size: 20px; font-family: 'Orbitron';">NAME</h2>
          <p id="cardTeam" style="margin:0; font-weight: bold; color: #444; font-size: 14px;">COUNTY</p>
          <div class="stats-grid">
            <div id="s1">PAC: 90</div><div id="s2">SHT: 90</div>
            <div id="s3">PHY: 90</div><div id="s4">SKL: 90</div>
          </div>
          <p style="font-size: 9px; font-weight: bold; margin-top: 10px; opacity: 0.6;">TRAVELBEYONDTHEPITCH.COM</p>
        </div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn btn-share" onclick="shareToStory()">SHARE TO INSTAGRAM</button>
    <button class="btn btn-next" onclick="tryAgain()">NEXT PACK</button>
    <button class="btn btn-save" onclick="downloadImage()">SAVE PNG</button>
  </div>

<script>
// (Script blijft hetzelfde als voorheen voor de logica)
let credits = 3;
const legends = [
  { name: "Henry Shefflin", team: "Kilkenny", rat: 98, stats: [88, 99, 94, 97], img: "images/henry-shefflin-kilkenny-hurling.jpg" },
  { name: "Christy Ring", team: "Cork", rat: 99, stats: [91, 99, 98, 99], img: "images/christy-ring-cork-hurling.jpg" },
  { name: "Joe Canning", team: "Galway", rat: 96, stats: [82, 98, 92, 98], img: "images/joe-canning-galway-hurling.jpg" },
  { name: "Eddie Keher", team: "Kilkenny", rat: 97, stats: [84, 99, 87, 95], img: "images/eddie-keher-kilkenny-hurling.jpg" },
  { name: "Nicky Rackard", team: "Wexford", rat: 96, stats: [80, 99, 97, 90], img: "images/nicky-rackard-wexford-hurling.jpg" },
  { name: "Jimmy Doyle", team: "Tipperary", rat: 95, stats: [86, 96, 82, 97], img: "images/jimmy-doyle-tipperary-hurling.jpg" },
  { name: "Mick Mackey", team: "Limerick", rat: 96, stats: [88, 94, 98, 92], img: "images/mick-mackey-limerick-hurling.jpg" },
  { name: "Brian Whelahan", team: "Offaly", rat: 95, stats: [85, 88, 90, 96], img: "images/brian-whelahan-offaly-hurling.jpg" },
  { name: "Ken McGrath", team: "Waterford", rat: 94, stats: [84, 87, 95, 92], img: "images/ken-mcgrath-waterford-hurling.jpg" },
  { name: "T.J. Reid", team: "Kilkenny", rat: 95, stats: [80, 97, 89, 96], img: "images/tj-reid-kilkenny-hurling.jpg" },
  { name: "Patrick Horgan", team: "Cork", rat: 93, stats: [83, 96, 82, 95], img: "images/patrick-horgan-cork-hurling.jpg" },
  { name: "John Doyle", team: "Tipperary", rat: 95, stats: [82, 80, 99, 88], img: "images/john-doyle-tipperary-hurling.jpg" },
  { name: "Brian Corcoran", team: "Cork", rat: 94, stats: [82, 85, 96, 93], img: "images/brian-corcoran-cork-hurling.jpg" },
  { name: "Tony Keady", team: "Galway", rat: 93, stats: [84, 86, 95, 90], img: "images/tony-keady-galway-hurling.jpg" },
  { name: "Pádraic Maher", team: "Tipperary", rat: 93, stats: [82, 82, 97, 88], img: "images/padraic-maher-tipperary-hurling.jpg" },
  { name: "JJ Delaney", team: "Kilkenny", rat: 96, stats: [86, 75, 94, 98], img: "images/jj-delaney-kilkenny-hurling.jpg" },
  { name: "Cian Lynch", team: "Limerick", rat: 94, stats: [87, 85, 88, 99], img: "images/cian-lynch-limerick-hurling.jpg" },
  { name: "Eoin Kelly", team: "Tipperary", rat: 94, stats: [85, 97, 84, 94], img: "images/eoin-kelly-tipperary-hurling.jpg" },
  { name: "Tommy Walsh", team: "Kilkenny", rat: 95, stats: [88, 84, 92, 95], img: "images/tommy-walsh-kilkenny-hurling.jpg" },
  { name: "Babs Keating", team: "Tipperary", rat: 92, stats: [82, 91, 88, 93], img: "images/babs-keating-tipperary-hurling.jpg" },
  { name: "Dan Shanahan", team: "Waterford", rat: 91, stats: [86, 93, 94, 85], img: "images/dan-shanahan-waterford-hurling.jpg" },
  { name: "Jack Lynch", team: "Cork", rat: 94, stats: [85, 89, 90, 94], img: "images/jack-lynch-cork-hurling.jpg" },
  { name: "Frank Cummins", team: "Kilkenny", rat: 93, stats: [82, 84, 96, 89], img: "images/frank-cummins-kilkenny-hurling.jpg" },
  { name: "Tony Doran", team: "Wexford", rat: 91, stats: [78, 92, 95, 84], img: "images/tony-doran-wexford-hurling.jpg" },
  { name: "Michael Kavanagh", team: "Kilkenny", rat: 92, stats: [82, 94, 88, 91], img: "images/michael-kavanagh-kilkenny-hurling.jpg" }
];

function initiateOpening() {
  if (credits <= 0) return;
  credits--;
  document.getElementById('credit-count').innerText = credits;
  
  const pack = document.getElementById('main-pack');
  const flash = document.getElementById('flash-overlay');
  document.getElementById('pack-area').onclick = null;
  pack.classList.add('shake-active');

  setTimeout(() => {
    flash.classList.add('flash-trigger');
    setTimeout(revealLegend, 400);
  }, 3500); 
}

function revealLegend() {
  const random = legends[Math.floor(Math.random() * legends.length)];
  document.getElementById('cardName').innerText = random.name;
  document.getElementById('cardTeam').innerText = random.team.toUpperCase();
  document.getElementById('cardRating').innerText = random.rat;
  document.getElementById('cardImg').src = random.img;
  document.getElementById('s1').innerText = "PAC: " + random.stats[0];
  document.getElementById('s2').innerText = "SHT: " + random.stats[1];
  document.getElementById('s3').innerText = "PHY: " + random.stats[2];
  document.getElementById('s4').innerText = "SKL: " + random.stats[3];

  document.getElementById('pack-area').style.display = 'none';
  document.getElementById('card-container').style.display = 'block';

  setTimeout(() => {
    document.getElementById('cardInner').classList.add('is-flipped');
    setTimeout(() => { document.getElementById('controls').style.display = 'flex'; }, 1000);
  }, 100);
}

function tryAgain() {
  if (credits > 0) {
    document.getElementById('cardInner').classList.remove('is-flipped');
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('pack-area').style.display = 'flex';
    document.getElementById('pack-area').onclick = initiateOpening;
    document.getElementById('main-pack').classList.remove('shake-active');
  } else {
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('out-of-credits').style.display = 'block';
  }
}

function downloadImage() {
  const card = document.getElementById('legendCard');
  html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = `Legend_${document.getElementById('cardName').innerText}.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
}

async function shareToStory() {
  const card = document.getElementById('legendCard');
  const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true });
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'LegendCard.png', { type: 'image/png' });
    if (navigator.share) {
      try {
        await navigator.share({
          files: [file],
          title: 'My Hurling Legend',
          text: 'Check out my Ultimate Hurling Legend Card! #BeyondThePitch'
        });
      } catch (err) { console.error("Share failed", err); }
    } else { alert("Save the image manually to share on Instagram."); }
  });
}
</script>
</body>
</html>

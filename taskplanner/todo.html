<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond the Pitch - Productivity Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0f0f0f;
  --bg-secondary: #1a1a1a;
  --bg-card: #242424;
  --accent-q1: #ff6b6b;
  --accent-q2: #4ecdc4;
  --accent-q3: #ffe66d;
  --accent-q4: #95e1d3;
  --accent-email: #4285f4;
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --border: #333333;
  --success: #4ecdc4;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
}

/* Auth Overlay */
#auth-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-primary); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
}

.login-box {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 40px; border-radius: 16px; width: 90%; max-width: 400px;
    text-align: center;
}

.container { max-width: 1600px; margin: 0 auto; padding: 20px; }

/* Header */
.header {
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  padding: 20px 40px; display: flex; justify-content: space-between;
  align-items: center; position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(10px);
}

.logo {
  font-family: 'Space Mono', monospace; font-size: 24px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.sync-status { font-size: 12px; color: var(--success); display: flex; align-items: center; gap: 5px; }
.sync-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.btn {
  padding: 10px 20px; border: 2px solid var(--border); background: var(--bg-card);
  color: var(--text-primary); border-radius: 8px; cursor: pointer;
  font-weight: 500; font-size: 14px; transition: all 0.3s ease;
}

.btn-primary { background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); border: none; color: white; }
.btn-primary:hover { transform: translateY(-2px) scale(1.05); }

/* Navigation Tabs */
.tabs { display: flex; gap: 10px; margin: 30px 0; border-bottom: 2px solid var(--border); }
.tab {
  padding: 12px 24px; background: transparent; border: none;
  color: var(--text-secondary); cursor: pointer; font-size: 16px;
  position: relative; transition: 0.3s;
}
.tab.active { color: var(--text-primary); }
.tab.active::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 2px; background: linear-gradient(90deg, var(--accent-q1), var(--accent-q2));
}

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-value { font-size: 32px; font-weight: 700; font-family: 'Space Mono', monospace; }
.stat-card.q1 .stat-value { color: var(--accent-q1); }
.stat-card.q2 .stat-value { color: var(--accent-q2); }
.stat-card.q3 .stat-value { color: var(--accent-q3); }
.stat-card.q4 .stat-value { color: var(--accent-q4); }

/* Matrix Grid */
.matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
.quadrant { background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; padding: 20px; min-height: 400px; }
.quadrant.q1 { border-top: 4px solid var(--accent-q1); }
.quadrant.q2 { border-top: 4px solid var(--accent-q2); }
.quadrant.q3 { border-top: 4px solid var(--accent-q3); }
.quadrant.q4 { border-top: 4px solid var(--accent-q4); }

.task-list { display: flex; flex-direction: column; gap: 10px; min-height: 50px; }
.task-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 15px; cursor: move; }
.task-checkbox { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.task-checkbox.checked { background: var(--success); border-color: var(--success); }
.task-checkbox.checked::after { content: '✓'; color: white; font-weight: bold; }
.task-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.task-badge { font-size: 10px; padding: 2px 8px; background: rgba(255,255,255,0.1); border-radius: 4px; color: var(--text-secondary); }

/* Targets & Modal & Toast (Styles from your provided code) */
.progress-bar { height: 8px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; margin: 10px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-q1), var(--accent-q2)); transition: 0.5s; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
.form-input { width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 15px; }
.toast { position: fixed; bottom: 30px; right: 30px; background: var(--success); color: white; padding: 15px 25px; border-radius: 8px; z-index: 2000; }
@media (max-width: 768px) { .matrix-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <h2 style="margin-bottom: 20px;">⚡ Dashboard Toegang</h2>
        <input type="text" id="user-name" class="form-input" placeholder="Je naam">
        <input type="password" id="access-code" class="form-input" placeholder="Toegangscode" value="beyondthepitch">
        <button class="btn btn-primary" style="width: 100%" onclick="login()">Start Sessie</button>
    </div>
</div>

<div class="header">
  <div class="logo">⚡ Beyond the Pitch</div>
  <div class="sync-status">
    <div class="sync-dot"></div>
    <span id="sync-text">Gereed</span>
  </div>
  <div class="header-actions">
    <button class="btn-primary btn" onclick="openAddTaskModal()">+ Nieuwe Taak</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab" onclick="switchTab('targets')">2026 Targets</button>
    <button class="tab" onclick="switchTab('rewards')">Beloningen</button>
  </div>

  <div id="dashboard-view" class="view">
    <div class="stats-grid">
      <div class="stat-card q1"><div class="stat-value" id="stat-q1">0</div><div style="font-size: 12px;">Q1: Do</div></div>
      <div class="stat-card q2"><div class="stat-value" id="stat-q2">0</div><div style="font-size: 12px;">Q2: Plan</div></div>
      <div class="stat-card q3"><div class="stat-value" id="stat-q3">0</div><div style="font-size: 12px;">Q3: Delegate</div></div>
      <div class="stat-card q4"><div class="stat-value" id="stat-q4">0</div><div style="font-size: 12px;">Q4: Delete</div></div>
    </div>

    <div class="matrix-grid">
      <div class="quadrant q1" data-quadrant="q1" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3 style="margin-bottom:15px; font-family:'Space Mono'">Q1: DO FIRST</h3>
        <div class="task-list" id="tasks-q1"></div>
      </div>
      <div class="quadrant q2" data-quadrant="q2" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3 style="margin-bottom:15px; font-family:'Space Mono'">Q2: SCHEDULE</h3>
        <div class="task-list" id="tasks-q2"></div>
      </div>
      <div class="quadrant q3" data-quadrant="q3" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3 style="margin-bottom:15px; font-family:'Space Mono'">Q3: DELEGATE</h3>
        <div class="task-list" id="tasks-q3"></div>
      </div>
      <div class="quadrant q4" data-quadrant="q4" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3 style="margin-bottom:15px; font-family:'Space Mono'">Q4: ELIMINATE</h3>
        <div class="task-list" id="tasks-q4"></div>
      </div>
    </div>
  </div>

  <div id="targets-view" class="view" style="display: none;">
    <h2 style="margin-bottom: 20px;">🎯 Bedrijfstargets 2026</h2>
    <div id="targets-grid" class="stats-grid"></div>
  </div>

  <div id="rewards-view" class="view" style="display: none;">
    <h2 style="margin-bottom: 20px;">🏆 Beloningen</h2>
    <div class="stat-card">
        <div class="stat-label">Totaal Punten</div>
        <div class="stat-value" id="total-points">0</div>
    </div>
  </div>
</div>

<div class="modal" id="task-modal">
  <div class="modal-content">
    <h2 style="margin-bottom: 20px;">Nieuwe Taak</h2>
    <form onsubmit="saveTask(event)">
      <input type="text" id="task-name" class="form-input" placeholder="Wat moet er gebeuren?" required>
      <div style="display: flex; gap: 10px;">
          <select id="task-urgent" class="form-input"><option value="true">Urgent</option><option value="false">Niet Urgent</option></select>
          <select id="task-important" class="form-input"><option value="true">Belangrijk</option><option value="false">Niet Belangrijk</option></select>
      </div>
      <input type="text" id="task-assigned" class="form-input" placeholder="Toewijzen aan...">
      <button type="submit" class="btn btn-primary" style="width:100%">Opslaan in Sheets</button>
      <button type="button" class="btn" onclick="closeTaskModal()" style="width:100%; margin-top:10px; background:transparent;">Annuleren</button>
    </form>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyDP6EI6NLu8pAAG6o2Y-mw3BqsU8gtkmTPda-UaLMITCvmhWTCbQkBoWWREMJcePjDug/exec';
let config = { name: '', code: '' };
let tasks = [];
let draggedTask = null;

function login() {
    config.name = document.getElementById('user-name').value;
    config.code = document.getElementById('access-code').value;
    if(!config.name) return alert("Vul je naam in");
    document.getElementById('auth-overlay').style.display = 'none';
    loadTasks();
    setInterval(loadTasks, 30000);
}

async function loadTasks() {
    updateSync('Syncing...');
    try {
        const res = await fetch(`${API_URL}?action=getTasks&code=${config.code}`);
        const data = await res.json();
        tasks = data.tasks || [];
        renderTasks();
        updateSync('Gereed');
    } catch (e) { updateSync('Sync Fout'); }
}

function renderTasks() {
    ['q1', 'q2', 'q3', 'q4'].forEach(q => {
        const container = document.getElementById('tasks-' + q);
        const qTasks = tasks.filter(t => t.quadrant === q && t.status !== 'Done');
        
        container.innerHTML = qTasks.map(task => `
            <div class="task-item" draggable="true" ondragstart="draggedTask = tasks.find(t => t.id == ${task.id})">
                <div style="display:flex; gap:10px; align-items:start;">
                    <div class="task-checkbox" onclick="toggleTask(${task.id})"></div>
                    <div style="flex:1">
                        <div class="task-title">${task.name}</div>
                        <div class="task-badge">👤 ${task.createdBy || 'Onbekend'}</div>
                    </div>
                    <button onclick="deleteTask(${task.id})" style="background:none; border:none; color:grey; cursor:pointer;">×</button>
                </div>
            </div>
        `).join('');
        document.getElementById('stat-' + q).textContent = qTasks.length;
    });
    updateRewards();
}

async function saveTask(e) {
    e.preventDefault();
    updateSync('Opslaan...');
    const urgent = document.getElementById('task-urgent').value === 'true';
    const important = document.getElementById('task-important').value === 'true';
    let q = (urgent && important) ? 'q1' : (!urgent && important) ? 'q2' : (urgent && !important) ? 'q3' : 'q4';

    const newTask = {
        id: Date.now(),
        name: document.getElementById('task-name').value,
        urgent, important, quadrant: q,
        status: 'To Do',
        createdBy: config.name
    };

    try {
        await fetch(`${API_URL}?action=addTask&code=${config.code}`, {
            method: 'POST',
            body: JSON.stringify(newTask)
        });
        closeTaskModal();
        showToast('Opgeslagen in Google Sheets!');
        loadTasks();
    } catch (e) { showToast('Fout bij opslaan'); }
}

async function toggleTask(id) {
    const task = tasks.find(t => t.id == id);
    task.status = 'Done';
    updateSync('Bijwerken...');
    await fetch(`${API_URL}?action=updateTask&code=${config.code}`, {
        method: 'POST',
        body: JSON.stringify(task)
    });
    showToast('Taak voltooid!');
    loadTasks();
}

// Drag & Drop
function allowDrop(e) { e.preventDefault(); }
async function drop(e) {
    e.preventDefault();
    const newQ = e.currentTarget.dataset.quadrant;
    if (draggedTask && draggedTask.quadrant !== newQ) {
        draggedTask.quadrant = newQ;
        // Update flags
        if(newQ === 'q1') { draggedTask.urgent = true; draggedTask.important = true; }
        if(newQ === 'q2') { draggedTask.urgent = false; draggedTask.important = true; }
        if(newQ === 'q3') { draggedTask.urgent = true; draggedTask.important = false; }
        if(newQ === 'q4') { draggedTask.urgent = false; draggedTask.important = false; }
        
        await fetch(`${API_URL}?action=updateTask&code=${config.code}`, {
            method: 'POST',
            body: JSON.stringify(draggedTask)
        });
        renderTasks();
    }
}

function switchTab(tab) {
    document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab + '-view').style.display = 'block';
    event.target.classList.add('active');
}

function updateSync(text) { document.getElementById('sync-text').textContent = text; }
function openAddTaskModal() { document.getElementById('task-modal').classList.add('active'); }
function closeTaskModal() { document.getElementById('task-modal').classList.remove('active'); }
function showToast(m) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function updateRewards() {
    const points = tasks.filter(t => t.status === 'Done').length * 10;
    document.getElementById('total-points').textContent = points;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix - Google Sheets Sync</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --accent-q1: #ff6b6b;
            --accent-q2: #4ecdc4;
            --accent-q3: #ffe66d;
            --accent-q4: #95e1d3;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #333333;
            --success: #4ecdc4;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Login Screen */
        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo h1 { font-family: 'Space Mono', monospace; font-size: 28px; background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary); }
        .form-input { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.3s ease; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); color: white; }

        /* Main App */
        #app { display: none; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Space Mono', monospace; font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
        
        .sync-status { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(78, 205, 196, 0.1); border: 1px solid var(--success); border-radius: 20px; font-size: 12px; color: var(--success); }
        .sync-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .tabs { display: flex; gap: 10px; margin: 30px 0; border-bottom: 2px solid var(--border); }
        .tab { padding: 12px 24px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 16px; position: relative; }
        .tab.active { color: var(--text-primary); }
        .tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent-q1), var(--accent-q2)); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 32px; font-weight: 700; font-family: 'Space Mono', monospace; }
        .stat-card.q1 .stat-value { color: var(--accent-q1); }
        .stat-card.q2 .stat-value { color: var(--accent-q2); }
        .stat-card.q3 .stat-value { color: var(--accent-q3); }
        .stat-card.q4 .stat-value { color: var(--accent-q4); }

        .matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .quadrant { background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; padding: 20px; min-height: 400px; }
        .quadrant.q1 { border-top: 4px solid var(--accent-q1); }
        .quadrant.q2 { border-top: 4px solid var(--accent-q2); }
        .quadrant.q3 { border-top: 4px solid var(--accent-q3); }
        .quadrant.q4 { border-top: 4px solid var(--accent-q4); }

        .task-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; transition: 0.3s; }
        .task-header { display: flex; gap: 12px; align-items: center; }
        .task-checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .task-checkbox.checked { background: var(--success); border-color: var(--success); }
        .task-checkbox.checked::after { content: '✓'; color: white; font-size: 12px; }
        
        .task-title { font-weight: 600; font-size: 14px; }
        .task-badge { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--text-secondary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <h1>⚡ EISENHOWER</h1>
                <p>Google Sheets Sync</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Jouw Naam</label>
                    <input type="text" class="form-input" id="user-name" placeholder="Naam" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Toegangscode</label>
                    <input type="password" class="form-input" id="access-code" value="beyondthepitch" required>
                </div>
                <button type="submit" class="btn btn-primary">Start Sessie</button>
            </form>
        </div>
    </div>
</div>

<div id="app">
    <div class="header">
        <div class="logo">⚡ EISENHOWER</div>
        <div class="sync-status">
            <div class="sync-dot"></div>
            <span id="sync-status-text">Gereed</span>
        </div>
        <div id="logged-user" style="font-size: 14px; color: var(--text-secondary);">User</div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card q1"><div class="stat-value" id="stat-q1">0</div><div style="font-size: 12px;">Q1: Do</div></div>
            <div class="stat-card q2"><div class="stat-value" id="stat-q2">0</div><div style="font-size: 12px;">Q2: Plan</div></div>
            <div class="stat-card q3"><div class="stat-value" id="stat-q3">0</div><div style="font-size: 12px;">Q3: Delegate</div></div>
            <div class="stat-card q4"><div class="stat-value" id="stat-q4">0</div><div style="font-size: 12px;">Q4: Delete</div></div>
        </div>

        <button class="btn btn-primary" onclick="openAddTaskModal()" style="margin-bottom: 20px; width: auto; padding: 10px 20px;">+ Nieuwe Taak</button>

        <div class="matrix-grid">
            <div class="quadrant q1"><h3>Q1: Urgent & Belangrijk</h3><div id="tasks-q1" class="task-list"></div></div>
            <div class="quadrant q2"><h3>Q2: Niet Urgent & Belangrijk</h3><div id="tasks-q2" class="task-list"></div></div>
            <div class="quadrant q3"><h3>Q3: Urgent & Niet Belangrijk</h3><div id="tasks-q3" class="task-list"></div></div>
            <div class="quadrant q4"><h3>Q4: Niet Urgent & Niet Belangrijk</h3><div id="tasks-q4" class="task-list"></div></div>
        </div>
    </div>
</div>

<div class="modal" id="task-modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 20px;">Nieuwe Taak</h2>
        <form onsubmit="saveTask(event)">
            <input type="text" id="task-name" class="form-input" placeholder="Wat moet er gebeuren?" required style="margin-bottom: 15px;">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <select id="task-urgent" class="form-input" required><option value="">Urgent?</option><option value="true">Ja</option><option value="false">Nee</option></select>
                <select id="task-important" class="form-input" required><option value="">Belangrijk?</option><option value="true">Ja</option><option value="false">Nee</option></select>
            </div>
            <button type="submit" class="btn btn-primary">Toevoegen aan Lijst</button>
            <button type="button" onclick="closeTaskModal()" class="btn" style="margin-top: 10px; background: transparent; color: var(--text-secondary);">Annuleren</button>
        </form>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyDP6EI6NLu8pAAG6o2Y-mw3BqsU8gtkmTPda-UaLMITCvmhWTCbQkBoWWREMJcePjDug/exec';
    
    let config = { userName: '', accessCode: '', isLoggedIn: false };
    let tasks = [];

    document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        config.userName = document.getElementById('user-name').value;
        config.accessCode = document.getElementById('access-code').value;
        config.isLoggedIn = true;
        showApp();
    });

    function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('logged-user').textContent = "👤 " + config.userName;
        loadTasks();
        setInterval(loadTasks, 20000); // Auto-sync elke 20 sec
    }

    async function loadTasks() {
        updateSyncStatus('Syncing...');
        try {
            const res = await fetch(`${API_URL}?action=getTasks&code=${config.accessCode}`);
            const data = await res.json();
            if (data.tasks) {
                tasks = data.tasks;
                renderTasks();
                updateSyncStatus('Gereed');
            }
        } catch (err) {
            updateSyncStatus('Sync Fout');
        }
    }

    async function saveTask(e) {
        e.preventDefault();
        updateSyncStatus('Opslaan...');
        
        const urgent = document.getElementById('task-urgent').value === 'true';
        const important = document.getElementById('task-important').value === 'true';
        let quadrant = (urgent && important) ? 'q1' : (!urgent && important) ? 'q2' : (urgent && !important) ? 'q3' : 'q4';

        const taskData = {
            id: Date.now().toString(),
            name: document.getElementById('task-name').value,
            urgent, important, quadrant,
            status: 'To Do',
            createdBy: config.userName
        };

        try {
            await fetch(`${API_URL}?action=addTask&code=${config.accessCode}`, {
                method: 'POST',
                body: JSON.stringify(taskData)
            });
            closeTaskModal();
            showToast('Taak toegevoegd!');
            loadTasks();
        } catch (err) {
            showToast('Fout bij opslaan');
        }
    }

    async function toggleTask(id) {
        const task = tasks.find(t => t.id.toString() === id.toString());
        if (!task) return;

        const newStatus = task.status === 'Done' ? 'To Do' : 'Done';
        task.status = newStatus;

        try {
            await fetch(`${API_URL}?action=updateTask&code=${config.accessCode}`, {
                method: 'POST',
                body: JSON.stringify(task)
            });
            renderTasks();
            showToast(newStatus === 'Done' ? 'Taak voltooid!' : 'Taak heropend');
        } catch (err) {
            showToast('Fout bij bijwerken');
        }
    }

    function renderTasks() {
        ['q1', 'q2', 'q3', 'q4'].forEach(q => {
            const container = document.getElementById('tasks-' + q);
            const quadrantTasks = tasks.filter(t => t.quadrant === q && t.status !== 'Done');
            
            container.innerHTML = quadrantTasks.map(task => `
                <div class="task-item">
                    <div class="task-header">
                        <div class="task-checkbox ${task.status === 'Done' ? 'checked' : ''}" onclick="toggleTask('${task.id}')"></div>
                        <div style="flex:1">
                            <div class="task-title">${task.name}</div>
                            <div style="display:flex; gap:5px; margin-top:5px;">
                                <span class="task-badge">👤 ${task.createdBy || 'Onbekend'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            const count = tasks.filter(t => t.quadrant === q && t.status !== 'Done').length;
            document.getElementById('stat-' + q).textContent = count;
        });
    }

    function updateSyncStatus(text) {
        document.getElementById('sync-status-text').textContent = text;
    }

    function openAddTaskModal() { document.getElementById('task-modal').classList.add('active'); }
    function closeTaskModal() { document.getElementById('task-modal').classList.remove('active'); }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix Pro - 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-card: #242424;
            --accent-q1: #ff6b6b; --accent-q2: #4ecdc4; --accent-q3: #ffe66d; --accent-q4: #95e1d3;
            --accent-outlook: #0078d4; --text-primary: #ffffff; --text-secondary: #a0a0a0; --border: #333333;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); padding-bottom: 50px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Navigatie Tabs */
        .tab-container { display: flex; gap: 10px; margin-bottom: 25px; margin-top: 10px; }
        .tab-btn { padding: 12px 24px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: 600; font-family: inherit; }
        .tab-btn.active { background: var(--accent-q2); color: #000; border-color: var(--accent-q2); box-shadow: 0 4px 15px rgba(78, 205, 196, 0.2); }

        /* Secties Styling */
        .content-section { margin-bottom: 30px; background: var(--bg-secondary); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        
        /* Kaarten (Targets & Routines) */
        .card { background: var(--bg-card); padding: 18px; border-radius: 10px; border-left: 4px solid var(--accent-q2); border: 1px solid var(--border); border-left: 4px solid var(--accent-q2); }
        .card-val { font-size: 22px; font-weight: 700; margin: 8px 0; color: var(--accent-q2); }
        .card-label { font-size: 11px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; }

        /* Matrix */
        .matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .quadrant { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; min-height: 480px; }
        .quadrant h3 { font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 20px; letter-spacing: 1px; }

        /* Taken Styling */
        .task-item { background: var(--bg-secondary); border: 1px solid var(--border); padding: 16px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; position: relative; }
        .task-item:hover { border-color: #666; transform: translateY(-2px); }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .task-title { font-weight: 600; font-size: 14px; line-height: 1.4; flex: 1; }
        
        .task-deadline { font-size: 10px; padding: 3px 8px; border-radius: 5px; white-space: nowrap; font-weight: bold; }
        .date-normal { color: var(--accent-q2); background: rgba(78, 205, 196, 0.1); }
        .date-urgent { color: var(--accent-q1); background: rgba(255, 107, 107, 0.1); border: 1px solid var(--accent-q1); }
        
        .task-note { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
        .task-item.expanded .task-note { display: block; }

        .task-actions { display: flex; gap: 8px; margin-top: 15px; }
        .btn-mini { font-size: 10px; padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn-mini:hover { background: #444; }
        .btn-outlook { background: var(--accent-outlook); }

        /* Login & Modals */
        #auth-overlay { position: fixed; inset: 0; background: var(--bg-primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg-secondary); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 350px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 15px; width: 450px; border: 1px solid var(--border); }
        .form-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid var(--border); color: white; border-radius: 8px; font-family: inherit; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <div class="logo" style="font-size: 24px; margin-bottom: 25px; text-align: center;">⚡ MATRIX LOGIN</div>
        <input type="text" id="user-name" class="form-input" placeholder="Je Naam">
        <input type="password" id="access-code" class="form-input" placeholder="Toegangscode">
        <button onclick="login()" style="width:100%; padding:14px; background:var(--accent-q2); border:none; border-radius:8px; cursor:pointer; font-weight:bold; color: black; font-size: 14px;">Dashboard Openen</button>
    </div>
</div>

<div class="header">
  <div class="logo">⚡ MATRIX PRO</div>
  <div style="display:flex; gap:12px; align-items:center;">
    <span id="display-name" style="font-size:12px; color:var(--text-secondary)"></span>
    <button class="btn-mini" style="background:var(--accent-q1)" onclick="openModal()">+ Nieuwe Taak</button>
    <button class="btn-mini" onclick="logout()">Uitloggen</button>
  </div>
</div>

<div class="container">
    <div class="tab-container">
        <button class="tab-btn active" id="btn-matrix" onclick="switchTab('matrix')">📊 Eisenhower Matrix</button>
        <button class="tab-btn" id="btn-routines" onclick="switchTab('routines')">♻️ Recurring Routines</button>
    </div>

    <div id="view-matrix">
        <div class="content-section">
            <h3 class="card-label">🎯 Prestatie Targets</h3>
            <div id="targets-display" class="grid-layout">
                <p style="color: var(--text-secondary); font-size: 12px;">Data ophalen...</p>
            </div>
        </div>

        <div class="matrix-grid">
            <div class="quadrant" id="q1" style="border-top: 3px solid var(--accent-q1)"><h3>🔥 Urgent & Belangrijk</h3><div class="task-list"></div></div>
            <div class="quadrant" id="q2" style="border-top: 3px solid var(--accent-q2)"><h3>📅 Planning (Q2)</h3><div class="task-list"></div></div>
            <div class="quadrant" id="q3" style="border-top: 3px solid var(--accent-q3)"><h3>👥 Delegeren (Q3)</h3><div class="task-list"></div></div>
            <div class="quadrant" id="q4" style="border-top: 3px solid var(--accent-q4)"><h3>🗑️ Elimineren (Q4)</h3><div class="task-list"></div></div>
        </div>
    </div>

    <div id="view-routines" style="display:none;">
        <div class="content-section">
            <h3 class="card-label">♻️ Routines (Daily/Weekly/Monthly)</h3>
            <div id="routines-display" class="grid-layout">
                <p style="color: var(--text-secondary); font-size: 12px;">Routines laden...</p>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="task-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px;">Nieuwe Taak</h3>
      <input type="text" id="task-name" class="form-input" placeholder="Wat moet er gebeuren?">
      <textarea id="task-desc" class="form-input" placeholder="Beschrijving of notitie..." rows="3"></textarea>
      <div style="display:flex; gap:10px;">
          <input type="date" id="task-deadline" class="form-input">
          <select id="task-pos" class="form-input">
              <option value="q1">Q1: Urgent/Belangrijk</option>
              <option value="q2">Q2: Planning</option>
              <option value="q3">Q3: Delegeren</option>
              <option value="q4">Q4: Elimineren</option>
          </select>
      </div>
      <button class="btn-mini" style="width:100%; padding:12px; background:var(--accent-q2); color:black; font-weight:bold;" onclick="saveTask()">Opslaan in Cloud</button>
      <button class="btn-mini" style="width:100%; margin-top:10px; background:transparent;" onclick="closeModal()">Annuleren</button>
    </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwJiHFt9y_9FPHQ5aLWCM-hanLeUiG_zT65433rtp38Hu08Mb7TsJbsViU638zTrqfrpQ/exec'; 
let tasks = [], targets = [], routines = [];
let user = { name: '', code: '' };

function login() {
    user.name = document.getElementById('user-name').value;
    user.code = document.getElementById('access-code').value;
    if(!user.name || !user.code) return alert("Vul alles in");
    localStorage.setItem('matrix_user', user.name);
    localStorage.setItem('matrix_code', user.code);
    init();
}

function init() {
    const savedName = localStorage.getItem('matrix_user');
    const savedCode = localStorage.getItem('matrix_code');
    if(savedName && savedCode) {
        user.name = savedName; user.code = savedCode;
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('display-name').textContent = "Ingelogd: " + user.name;
        loadData();
        setInterval(loadData, 30000); 
    }
}

function switchTab(tab) {
    document.getElementById('view-matrix').style.display = (tab === 'matrix') ? 'block' : 'none';
    document.getElementById('view-routines').style.display = (tab === 'routines') ? 'block' : 'none';
    document.getElementById('btn-matrix').className = (tab === 'matrix') ? 'tab-btn active' : 'tab-btn';
    document.getElementById('btn-routines').className = (tab === 'routines') ? 'tab-btn active' : 'tab-btn';
}

function logout() { localStorage.clear(); location.reload(); }

async function loadData() {
    try {
        const res = await fetch(`${API_URL}?action=getAll&code=${user.code}`);
        const data = await res.json();
        tasks = data.tasks || [];
        targets = data.targets || [];
        routines = data.routines || [];
        renderTasks();
        renderTargets();
        renderRoutines();
    } catch (e) { console.error("Sync error:", e); }
}

function renderTargets() {
    const container = document.getElementById('targets-display');
    if (!targets.length) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:11px;">Geen targets gevonden.</p>'; return; }
    container.innerHTML = targets.map(t => `
        <div class="card">
            <div class="card-label">${t.naam}</div>
            <div class="card-val">${t.actueel} / ${t.doel}</div>
            <div style="font-size:10px; color:var(--text-secondary)">${t.eenheid}</div>
        </div>
    `).join('');
}

function renderRoutines() {
    const container = document.getElementById('routines-display');
    if (!routines.length) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:11px;">Geen routines gevonden.</p>'; return; }
    container.innerHTML = routines.map(r => `
        <div class="card" style="border-left-color: var(--accent-q3)">
            <div class="card-label">${r.frequentie}</div>
            <div style="font-weight:700; margin: 10px 0; font-size: 15px;">${r.naam}</div>
            <div style="font-size:11px; color:var(--text-secondary); margin-bottom: 12px;">${r.categorie}</div>
            <button class="btn-mini" onclick="alert('Routine bijgewerkt')">Markeer als Gedaan</button>
        </div>
    `).join('');
}

function renderTasks() {
    ['q1', 'q2', 'q3', 'q4'].forEach(q => {
        const list = document.querySelector(`#${q} .task-list`);
        list.innerHTML = tasks.filter(t => t.quadrant === q && t.status !== 'Done')
            .map(t => {
                let dateHtml = '', calParam = '';
                if (t.deadline) {
                    const cleanDate = String(t.deadline).split('T')[0];
                    const d = new Date(cleanDate);
                    if (!isNaN(d.getTime())) {
                        const today = new Date(); today.setHours(0,0,0,0);
                        const isUrgent = d <= today;
                        const day = String(d.getDate()).padStart(2, '0');
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        dateHtml = `<div class="task-deadline ${isUrgent ? 'date-urgent' : 'date-normal'}">📅 ${day}-${month}-${d.getFullYear()}</div>`;
                        calParam = `${d.getFullYear()}${month}${day}`;
                    }
                }
                return `
                <div class="task-item" onclick="this.classList.toggle('expanded')">
                    <div class="task-header"><div class="task-title">${t.name}</div>${dateHtml}</div>
                    <div class="task-note">${t.description || '<i>Geen extra notities.</i>'}</div>
                    <div class="task-actions" onclick="event.stopPropagation()">
                        <button class="btn-mini" style="color:var(--accent-q2)" onclick="completeTask('${t.id}')">✓ Done</button>
                        <button class="btn-mini" onclick="openCalendar('${t.name}', '${calParam}')">📅 Agenda</button>
                        <button class="btn-mini btn-outlook" onclick="window.open('https://outlook.office.com/mail/', '_blank')">📧 Mail</button>
                    </div>
                </div>`;
            }).join('');
    });
}

async function saveTask() {
    const name = document.getElementById('task-name').value;
    const desc = document.getElementById('task-desc').value;
    const deadline = document.getElementById('task-deadline').value;
    const q = document.getElementById('task-pos').value;
    if(!name) return alert("Naam verplicht");
    
    const newTask = { 
        id: Date.now().toString(), name, description: desc, deadline, quadrant: q, 
        status: 'To Do', user: user.name, urgent: (q==='q1'||q==='q3'), important: (q==='q1'||q==='q2') 
    };
    
    tasks.push(newTask);
    renderTasks();
    closeModal();
    await fetch(`${API_URL}?action=addTask&code=${user.code}`, { method: 'POST', body: JSON.stringify(newTask) });
    loadData();
}

async function completeTask(id) {
    tasks = tasks.filter(t => t.id != id);
    renderTasks();
    await fetch(`${API_URL}?action=updateTask&code=${user.code}`, { method: 'POST', body: JSON.stringify({ id, status: 'Done' }) });
}

function openCalendar(title, dateParam) {
    if(!dateParam) return alert("Geen datum ingesteld voor deze taak.");
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dateParam}/${dateParam}`, '_blank');
}

function openModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModal() { document.getElementById('task-modal').classList.remove('active'); }
init();
</script>
</body>
</html>

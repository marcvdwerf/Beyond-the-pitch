<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eisenhower Matrix Pro - 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0f0f0f;
  --bg-secondary: #1a1a1a;
  --bg-card: #242424;
  --accent-q1: #ff6b6b;
  --accent-q2: #4ecdc4;
  --accent-q3: #ffe66d;
  --accent-q4: #95e1d3;
  --accent-outlook: #0078d4;
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --border: #333333;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
}

/* Auth Overlay */
#auth-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-primary); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
}

.login-box {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 40px; border-radius: 16px; width: 90%; max-width: 400px;
    text-align: center;
}

.container { max-width: 1600px; margin: 0 auto; padding: 20px; }

/* Header */
.header {
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  padding: 15px 40px; display: flex; justify-content: space-between;
  align-items: center; position: sticky; top: 0; z-index: 100;
}

.logo {
  font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.btn {
  padding: 8px 16px; border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-primary); border-radius: 6px; cursor: pointer;
  font-size: 13px; transition: 0.3s;
}

.btn-primary { background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); border: none; }

/* Tabs */
.tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 1px solid var(--border); }
.tab {
  padding: 10px 20px; background: transparent; border: none;
  color: var(--text-secondary); cursor: pointer; position: relative;
}
.tab.active { color: var(--text-primary); font-weight: bold; }
.tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
  height: 2px; background: var(--accent-q2);
}

/* Matrix & Grid */
.matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.quadrant { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; min-height: 350px; }
.quadrant h3 { font-size: 12px; color: var(--text-secondary); margin-bottom: 15px; text-transform: uppercase; }

/* Task Items */
.task-item {
  background: var(--bg-secondary); border: 1px solid var(--border);
  padding: 12px; border-radius: 8px; margin-bottom: 10px;
}

.task-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-mini { font-size: 10px; padding: 4px 8px; background: #333; color: #ccc; border: none; border-radius: 4px; cursor: pointer; }
.btn-mini:hover { background: #444; color: white; }

/* Targets */
.targets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
.target-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
.progress-bg { height: 10px; background: #111; border-radius: 5px; margin: 10px 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent-q2); transition: 1s; width: 0%; }

/* Modal */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: var(--bg-card); padding: 30px; border-radius: 15px; width: 400px; }
.form-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid var(--border); color: white; border-radius: 5px; }
</style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <div class="logo" style="font-size: 28px; margin-bottom: 20px;">⚡ EISENHOWER</div>
        <input type="text" id="user-name" class="form-input" placeholder="Naam">
        <input type="password" id="access-code" class="form-input" placeholder="Toegangscode">
        <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="login()">Dashboard Laden</button>
    </div>
</div>

<div class="header">
  <div class="logo">⚡ MATRIX PRO</div>
  <div style="display: flex; gap: 10px; align-items: center;">
    <span id="display-name" style="font-size: 12px; color: var(--text-secondary);"></span>
    <button class="btn" onclick="logout()">Uitloggen</button>
    <button class="btn btn-primary" onclick="openModal()">+ Nieuwe Taak</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard', this)">Matrix</button>
    <button class="tab" onclick="switchTab('targets', this)">Targets 2026</button>
    <button class="tab" onclick="switchTab('outlook', this)">Outlook Inbox</button>
  </div>

  <div id="view-dashboard" class="content-view">
    <div class="matrix-grid">
      <div class="quadrant" id="q1"><h3>🔥 Urgent & Belangrijk</h3><div class="task-list"></div></div>
      <div class="quadrant" id="q2"><h3>📅 Planning (Q2)</h3><div class="task-list"></div></div>
      <div class="quadrant" id="q3"><h3>👥 Delegeren (Q3)</h3><div class="task-list"></div></div>
      <div class="quadrant" id="q4"><h3>🗑️ Elimineren (Q4)</h3><div class="task-list"></div></div>
    </div>
  </div>

  <div id="view-targets" class="content-view" style="display:none;">
    <div class="targets-grid" id="target-container">
      <p>Targets worden geladen uit Google Sheets...</p>
    </div>
  </div>

  <div id="view-outlook" class="content-view" style="display:none;">
    <div class="quadrant" style="width: 100%;">
        <h3>📧 Outlook Integratie</h3>
        <p style="color: var(--text-secondary); margin-bottom: 15px;">Koppel hier je mails om ze direct naar de matrix te slepen.</p>
        <button class="btn" onclick="window.open('https://outlook.office.com/mail/', '_blank')" style="background: var(--accent-outlook); border:none;">Open Outlook Web</button>
    </div>
  </div>
</div>

<div class="modal" id="task-modal">
  <div class="modal-content">
    <h3>Nieuwe Taak</h3><br>
    <input type="text" id="task-name" class="form-input" placeholder="Wat moet er gebeuren?">
    <select id="task-urgent" class="form-input"><option value="true">Urgent</option><option value="false">Niet Urgent</option></select>
    <select id="task-important" class="form-input"><option value="true">Belangrijk</option><option value="false">Niet Belangrijk</option></select>
    <button class="btn btn-primary" style="width: 100%;" onclick="saveTask()">Opslaan</button>
    <button class="btn" style="width: 100%; margin-top: 5px; background: transparent;" onclick="closeModal()">Annuleren</button>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyDP6EI6NLu8pAAG6o2Y-mw3BqsU8gtkmTPda-UaLMITCvmhWTCbQkBoWWREMJcePjDug/exec';
let tasks = [];
let user = { name: '', code: '' };

// AUTH & INIT
window.onload = () => {
    const savedUser = localStorage.getItem('matrix_user');
    const savedCode = localStorage.getItem('matrix_code');
    if(savedUser && savedCode) {
        user = { name: savedUser, code: savedCode };
        document.getElementById('auth-overlay').style.display = 'none';
        init();
    }
};

function login() {
    user.name = document.getElementById('user-name').value;
    user.code = document.getElementById('access-code').value;
    if(!user.name || !user.code) return alert("Vul alles in!");
    
    localStorage.setItem('matrix_user', user.name);
    localStorage.setItem('matrix_code', user.code);
    document.getElementById('auth-overlay').style.display = 'none';
    init();
}

function logout() {
    localStorage.clear();
    location.reload();
}

function init() {
    document.getElementById('display-name').textContent = "Ingelogd als: " + user.name;
    loadData();
    setInterval(loadData, 60000); // Elke minuut sync
}

// DATA LOADING
async function loadData() {
    try {
        const res = await fetch(`${API_URL}?action=getAll&code=${user.code}`);
        const data = await res.json();
        tasks = data.tasks || [];
        renderTasks();
        renderTargets(data.targets || []);
    } catch (e) { console.log("Sync error"); }
}

function renderTasks() {
    const qs = ['q1', 'q2', 'q3', 'q4'];
    qs.forEach(q => {
        const container = document.querySelector(`#${q} .task-list`);
        container.innerHTML = tasks.filter(t => t.quadrant === q && t.status !== 'Done')
            .map(t => `
                <div class="task-item">
                    <div style="font-weight:bold; font-size:14px;">${t.name}</div>
                    <div class="task-actions">
                        <button class="btn-mini" onclick="completeTask(${t.id})">✓ Klaar</button>
                        <button class="btn-mini" onclick="addToCalendar('${t.name}')">📅 Agenda</button>
                    </div>
                </div>
            `).join('');
    });
}

function renderTargets(targets) {
    const container = document.getElementById('target-container');
    if(!targets.length) return;
    container.innerHTML = targets.map(t => {
        const perc = Math.round((t.actueel / t.doel) * 100);
        return `
            <div class="target-card">
                <div style="display:flex; justify-content:space-between;">
                    <span>${t.naam}</span>
                    <span style="color:var(--accent-q2)">${perc}%</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" style="width:${perc}%"></div></div>
                <div style="font-size:12px; color:var(--text-secondary)">
                    ${t.eenheid}${t.actueel.toLocaleString()} van ${t.eenheid}${t.doel.toLocaleString()}
                </div>
            </div>
        `;
    }).join('');
}

// ACTIONS
async function saveTask() {
    const name = document.getElementById('task-name').value;
    const urgent = document.getElementById('task-urgent').value === 'true';
    const important = document.getElementById('task-important').value === 'true';
    const q = (urgent && important) ? 'q1' : (!urgent && important) ? 'q2' : (urgent && !important) ? 'q3' : 'q4';

    const newTask = { id: Date.now(), name, quadrant: q, status: 'To Do', user: user.name };
    
    // Optimistic Update
    tasks.push(newTask);
    renderTasks();
    closeModal();

    await fetch(`${API_URL}?action=addTask&code=${user.code}`, {
        method: 'POST',
        body: JSON.stringify(newTask)
    });
    loadData();
}

function addToCalendar(title) {
    const eventTitle = encodeURIComponent(title);
    const outlookUrl = `https://outlook.office.com/calendar/0/deeplink/compose?subject=${eventTitle}`;
    const googleUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${eventTitle}`;
    
    if(confirm("Toevoegen aan Outlook? (Annuleren voor Google Calendar)")) {
        window.open(outlookUrl, '_blank');
    } else {
        window.open(googleUrl, '_blank');
    }
}

// UI HELPERS
function switchTab(view, btn) {
    document.querySelectorAll('.content-view').forEach(v => v.style.display = 'none');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('view-' + view).style.display = 'block';
    btn.classList.add('active');
}

function openModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModal() { document.getElementById('task-modal').classList.remove('active'); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix Pro - 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-card: #242424;
            --accent-q1: #ff6b6b; --accent-q2: #4ecdc4; --accent-q3: #ffe66d; --accent-q4: #95e1d3;
            --accent-outlook: #0078d4; --text-primary: #ffffff; --text-secondary: #a0a0a0; --border: #333333;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        /* Header & Tabs */
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab { padding: 15px 25px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; }
        .tab.active { color: white; border-bottom: 2px solid var(--accent-q2); }

        /* Matrix */
        .matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .quadrant { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; min-height: 400px; }
        
        /* Task Item & Note Expand */
        .task-item { background: var(--bg-secondary); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .task-item:hover { border-color: #555; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .task-deadline { font-size: 11px; color: var(--accent-q1); font-weight: bold; }
        .task-note { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; }
        .task-item.expanded .task-note { display: block; }
        
        .task-actions { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .btn-mini { font-size: 10px; padding: 5px 8px; background: #333; color: #ccc; border: none; border-radius: 4px; cursor: pointer; }
        .btn-outlook { background: var(--accent-outlook); color: white; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 15px; width: 450px; }
        .form-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid var(--border); color: white; border-radius: 6px; }
        
        /* Auth Overlay */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box" style="text-align:center; background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid var(--border);">
        <h2 style="margin-bottom:20px;">⚡ MATRIX LOGIN</h2>
        <input type="text" id="user-name" class="form-input" placeholder="Je Naam">
        <input type="password" id="access-code" class="form-input" placeholder="Toegangscode">
        <button onclick="login()" style="width:100%; padding:12px; background:var(--accent-q2); border:none; border-radius:6px; cursor:pointer;">Dashboard Laden</button>
    </div>
</div>

<div class="header">
  <div class="logo">⚡ MATRIX PRO</div>
  <div style="display:flex; gap:10px;">
    <button class="btn btn-primary" onclick="openModal()">+ Nieuwe Taak</button>
    <button class="btn" onclick="logout()">Log uit</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard', this)">Matrix</button>
    <button class="tab" onclick="switchTab('targets', this)">Targets</button>
    <button class="tab" onclick="switchTab('outlook', this)">📧 Outlook Inbox</button>
  </div>

  <div id="view-dashboard" class="content-view">
    <div class="matrix-grid">
      <div class="quadrant" id="q1"><h3>🔥 Urgent & Belangrijk</h3><div class="task-list"></div></div>
      <div class="quadrant" id="q2"><h3>📅 Planning</h3><div class="task-list"></div></div>
      <div class="quadrant" id="q3"><h3>👥 Delegeren</h3><div class="task-list"></div></div>
      <div class="quadrant" id="q4"><h3>🗑️ Elimineren</h3><div class="task-list"></div></div>
    </div>
  </div>

  <div id="view-outlook" class="content-view" style="display:none;">
    <div class="quadrant" style="width:100%;">
        <h3>📧 Directe Outlook Actie</h3>
        <p style="color:var(--text-secondary); margin-bottom:20px;">Gebruik deze knop om direct op e-mails te reageren of je inbox te organiseren.</p>
        <button class="btn btn-outlook" onclick="window.open('https://outlook.office.com/mail/', '_blank')" style="padding:15px 30px;">Open Outlook Web</button>
    </div>
  </div>
</div>

<div class="modal" id="task-modal">
  <div class="modal-content">
    <h3>Nieuwe Taak Toevoegen</h3><br>
    <input type="text" id="task-name" class="form-input" placeholder="Onderwerp / Taak naam">
    <textarea id="task-desc" class="form-input" placeholder="Uitgebreide beschrijving / Notitie..." rows="4"></textarea>
    <div style="display:flex; gap:10px;">
        <div style="flex:1;">
            <label style="font-size:11px; color:var(--text-secondary)">Deadline</label>
            <input type="date" id="task-deadline" class="form-input">
        </div>
        <div style="flex:1;">
            <label style="font-size:11px; color:var(--text-secondary)">Matrix Positie</label>
            <select id="task-pos" class="form-input">
                <option value="q1">Q1: Urgent & Belangrijk</option>
                <option value="q2">Q2: Planning</option>
                <option value="q3">Q3: Delegeren</option>
                <option value="q4">Q4: Elimineren</option>
            </select>
        </div>
    </div>
    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="saveTask()">Taak Opslaan</button>
    <button class="btn" style="width:100%; margin-top:5px; background:transparent; border:none;" onclick="closeModal()">Annuleren</button>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwbuB-74canPEP2D39mKOcarhhuvBh2FN-xjoUOy0pOgT9klLORHc2Fq2mgg1KmvjOrqA/exec';
let tasks = [];
let user = { name: '', code: '' };

function login() {
    user.name = document.getElementById('user-name').value;
    user.code = document.getElementById('access-code').value;
    if(!user.name || !user.code) return alert("Vul gegevens in");
    localStorage.setItem('matrix_user', user.name);
    localStorage.setItem('matrix_code', user.code);
    document.getElementById('auth-overlay').style.display = 'none';
    init();
}

function init() { loadData(); setInterval(loadData, 60000); }
function logout() { localStorage.clear(); location.reload(); }

async function loadData() {
    try {
        const res = await fetch(`${API_URL}?action=getAll&code=${user.code}`);
        const data = await res.json();
        tasks = data.tasks || [];
        renderTasks();
    } catch (e) { console.log("Fout bij laden"); }
}

function renderTasks() {
    ['q1', 'q2', 'q3', 'q4'].forEach(q => {
        const container = document.querySelector(`#${q} .task-list`);
        container.innerHTML = tasks.filter(t => t.quadrant === q && t.status !== 'Done')
            .map(t => `
                <div class="task-item" onclick="this.classList.toggle('expanded')">
                    <div class="task-header">
                        <div style="font-weight:bold;">${t.name}</div>
                        ${t.deadline ? `<div class="task-deadline">📅 ${t.deadline}</div>` : ''}
                    </div>
                    <div class="task-note">${t.description || 'Geen extra notities.'}</div>
                    <div class="task-actions" onclick="event.stopPropagation()">
                        <button class="btn-mini" onclick="completeTask('${t.id}')">✓ Klaar</button>
                        <button class="btn-mini" onclick="openCalendar('${t.name}', '${t.deadline}')">📅 Agenda</button>
                        <button class="btn-mini btn-outlook" onclick="window.open('https://outlook.office.com/mail/', '_blank')">📧 Mail</button>
                    </div>
                </div>
            `).join('');
    });
}

async function saveTask() {
    const name = document.getElementById('task-name').value;
    const desc = document.getElementById('task-desc').value;
    const deadline = document.getElementById('task-deadline').value;
    const q = document.getElementById('task-pos').value;

    const newTask = { 
        id: Date.now().toString(), name, description: desc, deadline, 
        quadrant: q, status: 'To Do', user: user.name, 
        urgent: (q==='q1'||q==='q3'), important: (q==='q1'||q==='q2') 
    };

    tasks.push(newTask);
    renderTasks();
    closeModal();

    await fetch(`${API_URL}?action=addTask&code=${user.code}`, { method: 'POST', body: JSON.stringify(newTask) });
    loadData();
}

async function completeTask(id) {
    tasks = tasks.filter(t => t.id != id);
    renderTasks();
    await fetch(`${API_URL}?action=updateTask&code=${user.code}`, {
        method: 'POST', body: JSON.stringify({ id, status: 'Done' })
    });
}

function openCalendar(title, date) {
    const d = date ? date.replace(/-/g, '') : '';
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${d}/${d}`;
    window.open(url, '_blank');
}

function switchTab(view, btn) {
    document.querySelectorAll('.content-view').forEach(v => v.style.display = 'none');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('view-' + view).style.display = 'block';
    btn.classList.add('active');
}

function openModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModal() { document.getElementById('task-modal').classList.remove('active'); }
</script>
</body>
</html>

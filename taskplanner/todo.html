<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/marcvdwerf/Beyond-the-pitch/refs/heads/main/images/beyond%20the%20pitch%20logo.jpg">
    
    <title>Taskplanner Pro - Trello Integrated</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-card: #242424;
            --accent-q1: #ff6b6b; --accent-q2: #4ecdc4; --accent-q3: #ffe66d; --accent-q4: #95e1d3;
            --accent-outlook: #0078d4; --text-primary: #ffffff; --text-secondary: #a0a0a0; --border: #333333;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); padding-bottom: 50px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent-q1), var(--accent-q2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 25px; margin-top: 10px; overflow-x: auto; }
        .tab-btn { padding: 12px 24px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: 600; font-family: inherit; white-space: nowrap; }
        .tab-btn.active { background: var(--accent-q2); color: #000; border-color: var(--accent-q2); box-shadow: 0 4px 15px rgba(78, 205, 196, 0.2); }

        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--accent-q2); margin-bottom: 5px; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; }

        .search-container { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .search-input-wrapper { position: relative; margin-bottom: 12px; }
        .search-input-wrapper input { width: 100%; padding: 12px 40px 12px 15px; background: var(--bg-secondary); border: 1px solid var(--border); color: white; border-radius: 8px; font-family: inherit; }
        
        .content-section { margin-bottom: 30px; background: var(--bg-secondary); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        
        .matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .quadrant { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; min-height: 480px; position: relative; }
        .quadrant h3 { font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 20px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .quadrant-count { background: var(--bg-secondary); padding: 3px 10px; border-radius: 12px; font-weight: 700; }

        .task-item { background: var(--bg-secondary); border: 1px solid var(--border); padding: 16px; border-radius: 10px; margin-bottom: 12px; transition: 0.2s; position: relative; }
        .task-title { font-weight: 600; font-size: 14px; line-height: 1.4; flex: 1; }
        .task-actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .btn-mini { font-size: 10px; padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }

        #auth-overlay { position: fixed; inset: 0; background: var(--bg-primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg-secondary); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 350px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 15px; width: 450px; border: 1px solid var(--border); }
        .form-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid var(--border); color: white; border-radius: 8px; font-family: inherit; }

        #loading-indicator { position: fixed; top: 70px; right: 20px; background: var(--bg-card); padding: 10px 20px; border-radius: 8px; font-size: 12px; z-index: 999; border: 1px solid var(--border); display: none; }
        #loading-indicator.show { display: block; }

        @media (max-width: 768px) {
            .matrix-grid { grid-template-columns: 1fr; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <div class="logo" style="font-size: 24px; margin-bottom: 25px; text-align: center;">⚡ MATRIX LOGIN</div>
        <input type="text" id="user-name" class="form-input" placeholder="Je Naam">
        <input type="password" id="access-code" class="form-input" placeholder="Toegangscode">
        <button onclick="login()" style="width:100%; padding:14px; background:var(--accent-q2); border:none; border-radius:8px; cursor:pointer; font-weight:bold; color: black;">Dashboard Openen</button>
    </div>
</div>

<div class="header">
  <div class="logo">⚡ MATRIX PRO</div>
  <div style="display:flex; gap:12px; align-items:center;">
    <span id="display-name" style="font-size:12px; color:var(--text-secondary)"></span>
    <button class="btn-mini" style="background:var(--accent-q1)" onclick="openModal()">+ Nieuwe Taak</button>
    <button class="btn-mini" onclick="logout()">Uitloggen</button>
  </div>
</div>

<div id="loading-indicator">⏳ Synchroniseren...</div>

<div class="container">
    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('matrix')">📊 Eisenhower Matrix</button>
        <button class="tab-btn" onclick="switchTab('routines')">♻️ Recurring Routines</button>
    </div>

    <div id="view-matrix">
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Totaal Taken</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-done">0</div><div class="stat-label">Voltooid</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-urgent">0</div><div class="stat-label">🔥 Urgent</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-completion">0%</div><div class="stat-label">Ratio</div></div>
        </div>

        <div class="search-container">
            <input type="text" id="task-search" class="form-input" style="margin-bottom:0" placeholder="🔍 Zoek taken..." oninput="filterTasks(this.value)">
        </div>

        <div class="matrix-grid">
            <div class="quadrant" id="q1" data-quadrant="q1" style="border-top: 3px solid var(--accent-q1)">
                <h3>🔥 Urgent & Belangrijk <span class="quadrant-count" id="count-q1">0</span></h3>
                <div class="task-list"></div>
            </div>
            <div class="quadrant" id="q2" data-quadrant="q2" style="border-top: 3px solid var(--accent-q2)">
                <h3>📅 Planning (Q2) <span class="quadrant-count" id="count-q2">0</span></h3>
                <div class="task-list"></div>
            </div>
            <div class="quadrant" id="q3" data-quadrant="q3" style="border-top: 3px solid var(--accent-q3)">
                <h3>👥 Delegeren (Q3) <span class="quadrant-count" id="count-q3">0</span></h3>
                <div class="task-list"></div>
            </div>
            <div class="quadrant" id="q4" data-quadrant="q4" style="border-top: 3px solid var(--accent-q4)">
                <h3>🗑️ Elimineren (Q4) <span class="quadrant-count" id="count-q4">0</span></h3>
                <div class="task-list"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="task-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px;">✨ Nieuwe Taak</h3>
      
      <div style="margin-bottom:15px;">
        <label style="font-size:11px; color:var(--text-secondary); display:block; margin-bottom:5px;">📋 TRELLO LIJST (Optioneel)</label>
        <select id="task-template" class="form-input">
            <option value="">-- Geen Trello koppeling --</option>
            <option value="lima">Lima</option>
            <option value="gaelic">Gaelic Games</option>
            <option value="nadaam">Nadaam</option>
        </select>
      </div>

      <input type="text" id="task-name" class="form-input" placeholder="Wat moet er gebeuren?">
      <textarea id="task-desc" class="form-input" placeholder="Beschrijving..." rows="3"></textarea>
      
      <div style="display:flex; gap:10px;">
          <input type="date" id="task-deadline" class="form-input">
          <select id="task-pos" class="form-input">
              <option value="q1">Q1: Urgent</option>
              <option value="q2" selected>Q2: Planning</option>
              <option value="q3">Q3: Delegeren</option>
              <option value="q4">Q4: Elimineren</option>
          </select>
      </div>
      
      <button class="btn-mini" style="width:100%; padding:12px; background:var(--accent-q2); color:black; font-weight:bold;" onclick="saveTask()">💾 Opslaan & Synchroniseren</button>
      <button class="btn-mini" style="width:100%; margin-top:10px; background:transparent;" onclick="closeModal()">Annuleren</button>
    </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwJiHFt9y_9FPHQ5aLWCM-hanLeUiG_zT65433rtp38Hu08Mb7TsJbsViU638zTrqfrpQ/exec'; 

let tasks = [];
let user = { name: '', code: '' };

// ==================== AUTH ====================
function login() {
    user.name = document.getElementById('user-name').value.trim();
    user.code = document.getElementById('access-code').value.trim();
    if(!user.name || !user.code) return alert("Vul alles in");
    localStorage.setItem('matrix_user', user.name);
    localStorage.setItem('matrix_code', user.code);
    init();
}

function logout() { 
    localStorage.clear(); 
    location.reload(); 
}

function init() {
    const savedName = localStorage.getItem('matrix_user');
    const savedCode = localStorage.getItem('matrix_code');
    if(savedName && savedCode) {
        user.name = savedName; user.code = savedCode;
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('display-name').textContent = "👤 " + user.name;
        loadData();
    }
}

// ==================== TRELLO LOGICA ====================
async function syncToTrello(name, desc, listKey) {
    const apiKey = '2914b3ef8a1e1e53002b19ac471a0ded';
    const token = 'HIER_JE_TOKEN_PLAKKEN'; // <-- PLAK HIER JE TOKEN

    const listMapping = {
        'lima': '69924026ebd335126cbeffde',
        'gaelic': '69924038d05ad7ace7d42f54',
        'nadaam': '69924044b50f997ecd460ce6'
    };

    const listId = listMapping[listKey];
    if (!listId || token === 'ATTA094bbe4296e52917836b0df15dad65251e2d1b32efe3cd0a47f0cf8e71577034C110E631') return;

    const url = `https://api.trello.com/1/cards?idList=${listId}&key=${apiKey}&token=${token}&name=${encodeURIComponent(name)}&desc=${encodeURIComponent(desc)}`;

    try {
        await fetch(url, { method: 'POST' });
        console.log("Trello succes");
    } catch (e) {
        console.error("Trello Error", e);
    }
}

// ==================== DATA & SAVING ====================
async function loadData() {
    showLoading('⏳ Laden...');
    try {
        const res = await fetch(`${API_URL}?action=getAll&code=${user.code}`);
        const data = await res.json();
        tasks = data.tasks || [];
        renderTasks();
        updateStats();
        showLoading('✓ Bijgewerkt', 'success');
    } catch (e) {
        showLoading('⚠️ Fout', 'error');
    }
}

async function saveTask() {
    const name = document.getElementById('task-name').value;
    const desc = document.getElementById('task-desc').value;
    const date = document.getElementById('task-deadline').value;
    const quad = document.getElementById('task-pos').value;
    const trelloList = document.getElementById('task-template').value;

    if(!name) return alert("Naam verplicht");

    showLoading('⏳ Bezig met opslaan...');

    try {
        // 1. Dashboard (Google Sheets)
        await fetch(`${API_URL}?action=add&code=${user.code}&name=${encodeURIComponent(name)}&desc=${encodeURIComponent(desc)}&date=${date}&quadrant=${quad}`);
        
        // 2. Trello (Indien gekozen)
        if (trelloList) {
            await syncToTrello(name, desc, trelloList);
        }

        closeModal();
        loadData();
    } catch (e) {
        showLoading('⚠️ Fout bij opslaan', 'error');
    }
}

// ==================== UI FUNCTIES ====================
function renderTasks() {
    const activeTasks = tasks.filter(t => t.status !== 'Done');
    ['q1', 'q2', 'q3', 'q4'].forEach(q => {
        const list = document.querySelector(`#${q} .task-list`);
        const quadTasks = activeTasks.filter(t => t.quadrant === q);
        document.getElementById(`count-${q}`).textContent = quadTasks.length;
        
        list.innerHTML = quadTasks.map(t => `
            <div class="task-item">
                <div class="task-title">${t.name}</div>
                <div class="task-actions">
                    <button class="btn-mini" style="color:var(--accent-q2)" onclick="completeTask('${t.id}')">✓ Done</button>
                    <button class="btn-mini" style="background:var(--accent-q1)" onclick="deleteTask('${t.id}')">🗑️</button>
                </div>
            </div>
        `).join('');
    });
}

async function completeTask(id) {
    showLoading('⏳ Verwerken...');
    await fetch(`${API_URL}?action=updateStatus&code=${user.code}&id=${id}&status=Done`);
    loadData();
}

async function deleteTask(id) {
    if(!confirm("Verwijderen?")) return;
    showLoading('⏳ Verwijderen...');
    await fetch(`${API_URL}?action=delete&code=${user.code}&id=${id}`);
    loadData();
}

function updateStats() {
    const total = tasks.filter(t => t.status !== 'Done').length;
    document.getElementById('stat-total').textContent = total;
}

function openModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModal() { document.getElementById('task-modal').classList.remove('active'); }

function showLoading(msg, type='loading') {
    const ind = document.getElementById('loading-indicator');
    ind.textContent = msg; ind.className = 'show';
    if(type !== 'loading') setTimeout(() => ind.classList.remove('show'), 3000);
}

function switchTab(view) {
    alert("Switching to " + view);
}

init();
</script>
</body>
</html>

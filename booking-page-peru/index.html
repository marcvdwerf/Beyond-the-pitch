<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Experience - Beyond the Pitch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a; /* Alianza Lima Blue */
            --secondary: #1e293b;
            --accent: #10b981;
            --text: #2d3748;
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #000000 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 60px 20px;
            color: var(--text);
            position: relative;
        }

        /* Back Button */
        .btn-back {
            position: absolute; top: 20px; left: 20px;
            background: white; color: var(--primary);
            padding: 12px 24px; border-radius: 50px;
            text-decoration: none; font-weight: 700; font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s; z-index: 100;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-back:hover { background: #f8fafc; transform: translateY(-2px); }

        .booking-container {
            max-width: 850px; width: 100%; background: white; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden;
            position: relative;
        }

        .header {
            background: #1a202c; color: white; padding: 60px 30px; text-align: center;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80');
            background-size: cover; background-position: center;
        }

        .form-section { padding: 40px; }
        .section-title {
            font-size: 0.9rem; font-weight: 800; color: var(--primary);
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;
            border-bottom: 2px solid #f7fafc; padding-bottom: 8px;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; color: #4a5568; }
        input, select, textarea { padding: 14px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 1rem; background: #f8fafc; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; }

        /* Match Filter Box */
        .filter-box { background: #f1f5f9; padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .filter-container { display: flex; gap: 15px; }
        .filter-container select { flex: 1; }

        .experience-grid { display: grid; gap: 12px; margin-bottom: 25px; }
        .exp-card { border: 2px solid #edf2f7; border-radius: 16px; padding: 18px; cursor: pointer; transition: 0.3s; position: relative; }
        .exp-card.selected { border-color: var(--primary); background: rgba(30, 58, 138, 0.05); }
        .exp-card input { position: absolute; opacity: 0; }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 20px; border-radius: 14px; font-size: 1.1rem; font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: var(--secondary); transform: translateY(-2px); }

        #successMessage { display: none; text-align: center; padding: 60px 30px; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <a href="../index.html" class="btn-back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m7 7l-7-7 7-7"></path></svg>
        Back to Home
    </a>

    <div class="booking-container">
        <div class="header">
            <h1>Alianza ima</h1>
            <p style="font-weight: 500; opacity: 0.9;">Exclusive Football Experiences in Peru</p>
        </div>

        <div id="bookingForm" class="form-section">
            <div class="section-title">1. Personal Information</div>
            <div class="form-grid">
                <div class="form-group"><label>Full Name *</label><input type="text" id="name" placeholder="John Doe" required></div>
                <div class="form-group"><label>Email Address *</label><input type="email" id="email" placeholder="john@example.com" required></div>
                <div class="form-group"><label>Phone Number *</label><input type="tel" id="phone" placeholder="+31 6..." required></div>
            </div>

            <div class="section-title">2. Select Your Package</div>
            <div class="experience-grid">
                <label class="exp-card selected">
                    <input type="radio" name="experience" value="Half/Full Day Package" checked>
                    <strong>Half/Full Day Package – Hidden Spots & Football</strong>
                    <p style="font-size: 0.8rem; color: #718096; margin-top: 4px;">City exploration and Alianza  match tickets.</p>
                </label>
                <label class="exp-card">
                    <input type="radio" name="experience" value="Multi-Day Culture & Coastal">
                    <strong>Culture & Coastal – Multi-Day Trip</strong>
                    <p style="font-size: 0.8rem; color: #718096; margin-top: 4px;">Horse riding, gastronomy, and football.</p>
                </label>
            </div>

            <div class="section-title">3. Select Match Fixture (Feb 2026)</div>
            <div class="filter-box">
                <label>Filter by Competition:</label>
                <div class="filter-container">
                    <select id="compFilter">
                        <option value="all">All Competitions</option>
                        <option value="Liga1">Liga 1 (Peru)</option>
                        <option value="Libertadores">CONMEBOL Libertadores</option>
                    </select>
                </div>
            </div>

            <select id="match-selector" style="width: 100%; margin-bottom: 25px; border: 2px solid var(--primary);">
                <option value="">-- Choose your match --</option>
                
                <optgroup label="Liga 1 - Apertura" data-comp="Liga1">
                    <option value="2026-01-31 | Huancayo v Alianza Lima">Jan 31: Huancayo v Alianza Lima (18:00)</option>
                    <option value="2026-02-09 | Alianza Lima v Comerciantes Unidos">Feb 09: Alianza Lima v Comerciantes Unidos (00:00)</option>
                    <option value="2026-02-15 | Alianza Atl. v Alianza Lima">Feb 15: Alianza Atl. v Alianza Lima (02:00)</option>
                    <option value="2026-02-21 | Alianza Lima v Sport Boys">Feb 21: Alianza Lima v Sport Boys (02:00)</option>
                </optgroup>

                <optgroup label="CONMEBOL Libertadores" data-comp="Libertadores">
                    <option value="2026-02-05 | Club 2 de Mayo v Alianza Lima">Feb 05: Club 2 de Mayo v Alianza Lima (01:30)</option>
                    <option value="2026-02-12 | Alianza Lima v Club 2 de Mayo">Feb 12: Alianza Lima v Club 2 de Mayo (TBD)</option>
                </optgroup>
            </select>

            <div class="section-title">4. Trip Details</div>
            <div class="form-grid">
                <div class="form-group"><label>Selected Date *</label><input type="date" id="date" required></div>
                <div class="form-group"><label>Number of Guests *</label><input type="number" id="guests" min="1" value="2" required></div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label>Special Requests or Questions</label>
                <textarea id="requests" rows="3" placeholder="Dietary needs, hotel pickup, etc."></textarea>
            </div>

            <button type="button" class="btn-submit" id="submitBtn">Send Booking Request</button>
            <div class="loader" id="loader"></div>
        </div>

        <div id="successMessage">
            <div style="font-size: 3rem; margin-bottom: 15px;">⚽</div>
            <h2 style="color: var(--primary);">Request Sent!</h2>
            <p style="margin: 15px 0; color: #4a5568;">We have received your Alianza Lima experience request. We will contact you within 24 hours.</p>
            <button class="btn-submit" onclick="location.reload()" style="max-width: 200px;">New Booking</button>
        </div>
    </div>

    <script>
        const FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSeTI604id3nsbLY5CF76uf6Q6Gm7-Ngo4JumBnsROsDwuRbbw/formResponse';
        
        const FIELDS = {
            name: 'entry.761572476',
            email: 'entry.1144619265',
            phone: 'entry.1213010877',
            experience: 'entry.1446094233',
            date: 'entry.301148404',
            guests: 'entry.175134312',
            requests: 'entry.2094398847'
        };

        // Filter Logic
        const compFilter = document.getElementById('compFilter');
        const matchSelector = document.getElementById('match-selector');

        compFilter.addEventListener('change', () => {
            const val = compFilter.value;
            const groups = matchSelector.querySelectorAll('optgroup');
            groups.forEach(g => {
                g.style.display = (val === 'all' || g.getAttribute('data-comp') === val) ? 'block' : 'none';
            });
        });

        // Auto-date selection
        matchSelector.addEventListener('change', (e) => {
            if(e.target.value) {
                const datePart = e.target.value.split(' | ')[0];
                document.getElementById('date').value = datePart;
            }
        });

        // Experience card selection
        document.querySelectorAll('.exp-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.exp-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                card.querySelector('input').checked = true;
            });
        });

        // Submit Logic
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');

            if(!document.getElementById('name').value || !document.getElementById('email').value || !document.getElementById('date').value) {
                alert('Please fill in all required fields.');
                return;
            }

            btn.style.display = 'none';
            loader.style.display = 'block';

            const params = new URLSearchParams();
            params.append(FIELDS.name, document.getElementById('name').value);
            params.append(FIELDS.email, document.getElementById('email').value);
            params.append(FIELDS.phone, document.getElementById('phone').value);
            params.append(FIELDS.experience, document.querySelector('input[name="experience"]:checked').value);
            params.append(FIELDS.date, document.getElementById('date').value);
            params.append(FIELDS.guests, document.getElementById('guests').value);
            params.append(FIELDS.requests, `MATCH: ${matchSelector.value} | NOTES: ${document.getElementById('requests').value}`);

            try {
                await fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body: params });
                document.getElementById('bookingForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                window.scrollTo(0, 0);
            } catch (e) {
                alert('Connection error. Please try again.');
                btn.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>

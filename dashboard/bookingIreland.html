<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Experience - Beyond the Pitch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #059669; --secondary: #064e3b; --text: #1f2937; --bg-gradient: linear-gradient(135deg, #059669 0%, #064e3b 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text); position: relative; }
        .btn-back { position: absolute; top: 20px; left: 20px; background: white; color: var(--secondary); padding: 12px 24px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; z-index: 100; display: flex; align-items: center; gap: 8px; }
        .booking-container { max-width: 850px; width: 100%; background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; position: relative; }
        .header { background: #1a202c; color: white; padding: 50px 30px; text-align: center; background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1594223522959-1e38944f8f4a?auto=format&fit=crop&q=80'); background-size: cover; background-position: center; }
        .form-section { padding: 40px; }
        .section-title { font-size: 0.9rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; border-bottom: 2px solid #f7fafc; padding-bottom: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; color: #4a5568; }
        input, select, textarea { padding: 14px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 1rem; background: #f8fafc; outline: none; transition: 0.2s; width: 100%; }
        .filter-box { background: #f8fafc; padding: 25px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .filter-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .experience-grid { display: grid; gap: 12px; margin-bottom: 25px; }
        .exp-card { border: 2px solid #edf2f7; border-radius: 16px; padding: 18px; cursor: pointer; transition: 0.3s; position: relative; display: block; }
        .exp-card.selected { border-color: var(--primary); background: rgba(5, 150, 105, 0.05); }
        .exp-card input { position: absolute; opacity: 0; }
        .price-tag { float: right; color: var(--primary); font-weight: 700; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 20px; border-radius: 14px; font-size: 1.1rem; font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s; }
        #successMessage { display: none; text-align: center; padding: 60px 30px; }
    </style>
</head>
<body>

    <a href="../gaelic-games.html" class="btn-back">Back to Home</a>

    <div class="booking-container">
        <div class="header">
            <h1>Beyond the Pitch</h1>
            <p style="font-weight: 500; opacity: 0.9;">Official Experience Booking Portal</p>
        </div>

        <div id="bookingForm" class="form-section">
            <div class="section-title">1. Personal Information</div>
            <div class="form-grid">
                <div class="form-group"><label>Full Name *</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Email Address *</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Phone Number *</label><input type="tel" id="phone" required></div>
            </div>

            <div class="section-title">2. Choose Your Package</div>
            <div class="experience-grid">
                <label class="exp-card">
                    <input type="radio" name="experience" value="Full Experience">
                    <span class="price-tag">from €100 pp</span>
                    <strong>The Hurling experience</strong><br><small>  Learn all about the game from our Hurling Hero James + matchticket off your choice.</small>
                </label>
                <label class="exp-card">
                    <input type="radio" name="experience" value="Full Experience">
                    <span class="price-tag">from €100 pp</span>
                    <strong>Kilkenny premium package: Deep dive into Hurling + Match Tickets</strong><br><small> Weekend experience:Training plus the big match atmosphere at Nowlan park.</small>
                </label>
            </div>

            <div id="match-section" class="section-title">3. Select Match Fixture</div>
            <div class="filter-box" id="fixture-box" style="opacity: 0.5; pointer-events: none;">
                <div class="filter-container">
                    <div class="form-group">
                        <label>Sport</label>
                        <select id="sportFilter">
                            <option value="all">All Sports</option>
                            <option value="Hurling">Hurling</option>
                            <option value="Football">Gaelic Football</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Month</label>
                        <select id="monthFilter">
                            <option value="all">All Months</option>
                            <option value="feb">February</option>
                            <option value="mrt">March</option>
                            <option value="apr">April</option>
                            <option value="may">May</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <label>Available Fixtures</label>
                    <select id="match-selector">
                        <option value="">-- Choose a match --</option>
                    </select>
                </div>
            </div>

            <div class="section-title">4. Trip Details</div>
            <div class="form-grid">
                <div class="form-group"><label>Selected Date *</label><input type="date" id="date" required></div>
                <div class="form-group"><label>Number of Guests *</label><input type="number" id="guests" min="1" value="2" required></div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label>Special Requests / Notes</label>
                <textarea id="requests" placeholder="Any specific seating needs or experience goals?" rows="3"></textarea>
            </div>

            <button type="button" class="btn-submit" id="submitBtn">Confirm Booking Request</button>
        </div>

        <div id="successMessage">
            <div style="font-size: 3rem; margin-bottom: 15px;">🍀</div>
            <h2 style="color: var(--primary);">Success!</h2>
            <p style="margin: 15px 0; color: #4a5568;">We have received your request and will contact you shortly with the final price and details.</p>
            <button class="btn-submit" onclick="location.reload()" style="max-width: 200px;">New Booking</button>
        </div>
    </div>

        function buildMenu() {
            const selector = document.getElementById('match-selector');
            const sport = document.getElementById('sportFilter').value;
            const month = document.getElementById('monthFilter').value;
            selector.innerHTML = '<option value="">-- Choose a match --</option>';

            const groups = {};
            MATCH_DATA.forEach(m => {
                if ((sport === 'all' || m.sport === sport) && (month === 'all' || m.month === month)) {
                    const label = `${m.sport} - ${m.month.toUpperCase()}`;
                    if (!groups[label]) groups[label] = [];
                    groups[label].push(m);
                }
            });

            for (const [label, matches] of Object.entries(groups)) {
                const group = document.createElement('optgroup');
                group.label = label;
                matches.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = `${m.date} | ${m.teams} (Div ${m.div})`;
                    opt.textContent = `${m.date}: ${m.teams}`;
                    group.appendChild(opt);
                });
                selector.appendChild(group);
            }
        }

        // Package UI Logic
        document.querySelectorAll('input[name="experience"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('.exp-card').forEach(c => c.classList.remove('selected'));
                e.target.closest('.exp-card').classList.add('selected');
                
                const box = document.getElementById('fixture-box');
                if (e.target.value === 'Clinic Only') {
                    box.style.opacity = '0.5';
                    box.style.pointerEvents = 'none';
                    document.getElementById('match-selector').value = "";
                } else {
                    box.style.opacity = '1';
                    box.style.pointerEvents = 'auto';
                }
            });
        });

        document.getElementById('sportFilter').addEventListener('change', buildMenu);
        document.getElementById('monthFilter').addEventListener('change', buildMenu);
        document.getElementById('match-selector').addEventListener('change', (e) => {
            if(e.target.value) document.getElementById('date').value = e.target.value.split(' | ')[0];
        });

        // Submit to Google Sheets
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const date = document.getElementById('date').value;
            const exp = document.querySelector('input[name="experience"]:checked').value;
            const match = document.getElementById('match-selector').value;

            if(!name || !email || !date) { alert('Please fill in all required fields.'); return; }

            const formData = new FormData();
            formData.append(FIELDS.name, name);
            formData.append(FIELDS.email, email);
            formData.append(FIELDS.phone, document.getElementById('phone').value);
            formData.append(FIELDS.experience, exp + (exp === 'Clinic Only' ? ' (€40 pp)' : ' (Price on Request)'));
            formData.append(FIELDS.date, date);
            formData.append(FIELDS.guests, document.getElementById('guests').value);
            formData.append(FIELDS.requests, "Match: " + (match || "N/A") + " | Note: " + document.getElementById('requests').value);
            formData.append(FIELDS.partner, 'Ireland');

            try {
                await fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body: formData });
                document.getElementById('bookingForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                window.scrollTo(0, 0);
            } catch (e) { alert('Submission error. Please try again.'); }
        });

        buildMenu();
    </script>

</html>
